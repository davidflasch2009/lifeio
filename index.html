/* ==========================================================================
   2. Hinweise (Toasts), Sheets, Dialoge
   ========================================================================== */
let toastTimer = null;
function toast(msg, type = 'info', { duration = 3000, action } = {}) {
  const root = $('#toasts');
  clearTimeout(toastTimer);
  root.innerHTML = '';
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button><i class="toast-bar" style="animation-duration:${duration}ms"></i>` : ''}`;
  if (action) t.querySelector('button').addEventListener('click', () => { t.remove(); action.fn(); });
  root.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), duration);
}
const undoToast = (msg, undo) => toast(msg, 'info', { duration: 5000, action: { label: 'Rückgängig', fn: undo } });

function openSheet({ title, body, onMount }) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title || '')}">
    <div class="sheet-grab"></div>${title ? `<h3 class="sheet-title">${esc(title)}</h3>` : ''}${body}</div>`;
  $('#modal-root').appendChild(wrap);
  [...$('.sheet', wrap).children].forEach((c, i) => c.style.setProperty('--i', i));
  const prevFocus = document.activeElement;
  let closed = false;
  const onKey = e => { if (e.key === 'Escape') close(); };
  function close() {
    if (closed) return;
    closed = true;
    wrap.classList.remove('show');
    wrap.style.pointerEvents = 'none'; // während des Ausblendens keine Klicks mehr abfangen
    document.removeEventListener('keydown', onKey);
    setTimeout(() => wrap.remove(), 230);
    if (prevFocus && prevFocus.focus && document.contains(prevFocus) && !prevFocus.closest('.card')) prevFocus.focus({ preventScroll: true });
    if (wrap._onClose) wrap._onClose();
  }
  wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  document.addEventListener('keydown', onKey);
  requestAnimationFrame(() => wrap.classList.add('show'));
  if (onMount) onMount($('.sheet', wrap), close, fn => { wrap._onClose = fn; });
  return close;
}

function confirmDialog({ title, text, okLabel = 'OK', cancelLabel = 'Abbrechen', danger = false }) {
  return new Promise(resolve => {
    let result = false;
    openSheet({
      title,
      body: `<p class="sheet-text">${esc(text)}</p>
        <div class="sheet-actions"><span class="grow"></span>
          <button class="btn" data-k="no">${esc(cancelLabel)}</button>
          <button class="btn ${danger ? 'danger-fill' : 'primary'}" data-k="yes">${esc(okLabel)}</button>
        </div>`,
      onMount(sheet, close, onClose) {
        onClose(() => resolve(result));
        sheet.querySelector('[data-k=no]').addEventListener('click', close);
        sheet.querySelector('[data-k=yes]').addEventListener('click', () => { result = true; close(); });
        sheet.querySelector('[data-k=yes]').focus();
      }
    });
  });
}

/** Auswahl-Liste von unten; liefert den key der Auswahl oder null */
function actionSheet(title, options) {
  return new Promise(resolve => {
    let result = null;
    openSheet({
      title,
      body: `<div class="sheet-list">${options.map(o =>
        `<button class="btn ${o.danger ? 'danger' : ''}" data-k="${esc(o.key)}" ${o.disabled ? 'disabled' : ''}>${esc(o.label)}</button>`).join('')}
        <button class="btn" data-k="">Abbrechen</button></div>`,
      onMount(sheet, close, onClose) {
        onClose(() => resolve(result));
        sheet.addEventListener('click', e => {
          const b = e.target.closest('[data-k]');
          if (!b) return;
          result = b.dataset.k || null;
          close();
        });
      }
    });
  });
}

/* ==========================================================================
   3. Store – In-Memory + localStorage + Firestore (Realtime)
   Writes landen sofort lokal; Firestore synchronisiert im Hintergrund
   (mit enablePersistence auch offline).
   ========================================================================== */
const Store = (() => {
  const data = { folders: {}, items: {}, meta: {} };
  const listeners = new Set();
  const syncListeners = new Set();
  let owner = 'local';        // 'local' (Gast) oder Firebase-UID
  let cloudInit = false;      // Erst-Abgleich mit dem Konto erledigt?
  let mergePending = false;   // Gast-Daten warten noch auf den Upload
  let queue = [];             // Ops, die gemacht wurden, während Firebase nicht verbunden war
  let uid = null, db = null;
  let unsubs = [];
  let serverSeen = {};
  let pendingWrites = 0;
  let pendingInit = false;
  let askMergeFn = null;
  let loud = false, flushTimer = null;

  /* ---------- lokal ---------- */
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS.data);
      if (!raw) return;
      const o = JSON.parse(raw);
      owner = o.owner || 'local';
      cloudInit = !!o.cloudInit;
      mergePending = !!o.mergePending;
      queue = Array.isArray(o.queue) ? o.queue : [];
      for (const c of COLLS) if (o.colls && o.colls[c]) data[c] = o.colls[c];
    } catch (e) { console.warn('Lokaler Speicher defekt – wird neu aufgebaut', e); }
  }
  let quotaWarned = false;
  const saveLocal = debounce(() => {
    try {
      localStorage.setItem(LS.data, JSON.stringify({ owner, cloudInit, mergePending, queue, savedAt: Date.now(), colls: data }));
    } catch (e) {
      console.error(e);
      if (!quotaWarned) { quotaWarned = true; toast('Lokaler Speicher voll – bitte ein Backup machen', 'error'); }
    }
  }, 300);

  /** loud = Ansicht neu zeichnen; leise Änderungen (Tippen in Notizen) nur speichern */
  function changed(isLoud) {
    if (isLoud) loud = true;
    if (!flushTimer) flushTimer = setTimeout(flush, 0);
  }
  function flush() {
    flushTimer = null;
    saveLocal();
    if (!loud) return;
    loud = false;
    listeners.forEach(cb => { try { cb(); } catch (e) { console.error(e); } });
  }

  /* ---------- Firestore-Helfer ---------- */
  const ref = c => db.collection('users').doc(uid).collection(c);
  function toRemote(doc) {
    const o = JSON.parse(JSON.stringify(doc)); // entfernt undefined (mag Firestore nicht)
    delete o.id;
    return o;
  }
  const online = () => !!(uid && db);
  function track(p) {
    pendingWrites++;
    emitSync();
    p.catch(fsError).finally(() => { pendingWrites--; emitSync(); });
  }
  function emitSync() { const s = syncState(); syncListeners.forEach(cb => cb(s)); }
  function syncState() {
    if (!uid) return owner !== 'local' ? 'offline' : 'local';
    if (!navigator.onLine) return 'offline';
    return pendingWrites > 0 ? 'pending' : 'synced';
  }
  function enqueue(op) {
    // Cache gehört einem Konto, Firebase ist aber (noch) nicht verbunden → später nachholen
    if (owner !== 'local' && !uid) queue.push(op);
  }

  /* ---------- öffentliche API ---------- */
  function put(coll, id, doc, opts = {}) {
    const prev = data[coll][id];
    const next = opts.replace || !prev ? { ...doc, id } : { ...prev, ...doc, id };
    data[coll][id] = next;
    changed(!opts.silent);
    if (online()) { try { track(ref(coll).doc(id).set(toRemote(next), { merge: !opts.replace })); } catch (e) { fsError(e); } }
    else enqueue({ t: 'put', c: coll, id });
    return next;
  }
  function del(coll, id) {
    delete data[coll][id];
    changed(true);
    if (online()) { try { track(ref(coll).doc(id).delete()); } catch (e) { fsError(e); } }
    else enqueue({ t: 'del', c: coll, id });
  }
  /** Mehrere Writes – lokal sofort, remote in Firestore-Batches */
  async function batch(ops) {
    for (const op of ops) {
      if (op.type === 'put') {
        const prev = data[op.coll][op.id];
        data[op.coll][op.id] = op.replace || !prev ? { ...op.doc, id: op.id } : { ...prev, ...op.doc, id: op.id };
      } else delete data[op.coll][op.id];
    }
    changed(true);
    if (!online()) { ops.forEach(op => enqueue({ t: op.type === 'put' ? 'put' : 'del', c: op.coll, id: op.id })); return; }
    await remoteBatch(ops.map(op => ({ type: op.type, coll: op.coll, id: op.id, replace: op.replace })));
  }
  /** Ops in Firestore-Batches (max. 450 je Batch). Liefert false, wenn etwas schiefging. */
  async function remoteBatch(ops, { wait = 5000 } = {}) {
    let ok = true;
    for (let i = 0; i < ops.length; i += 450) {
      const b = db.batch();
      for (const op of ops.slice(i, i + 450)) {
        const r = ref(op.coll).doc(op.id);
        const doc = data[op.coll][op.id];
        try {
          if (op.type === 'put') { if (doc) b.set(r, toRemote(doc), { merge: !op.replace }); }
          else b.delete(r);
        } catch (e) { console.error('[Firestore] übersprungen', op, e); ok = false; }
      }
      const p = b.commit();
      track(p);
      p.catch(() => { ok = false; });
      // Offline löst commit() erst nach dem Server-Ack auf → nicht ewig blockieren
      if (navigator.onLine) await Promise.race([p.catch(() => {}), sleep(wait)]);
    }
    return ok;
  }
  const all = coll => Object.values(data[coll]);
  const raw = (coll, id) => data[coll][id] || null;
  function subscribe(cb) { listeners.add(cb); return () => listeners.delete(cb); }
  function settings() { return { theme: 'auto', ...(data.meta.settings || {}) }; }
  function saveSettings(patch) {
    const next = { ...settings(), ...patch };
    delete next.id;
    return put('meta', 'settings', next);
  }
  function resetData() {
    data.folders = {};
    data.items = {};
    data.meta = data.meta.settings ? { settings: data.meta.settings } : {};
    queue = [];
    changed(true);
  }
  const hasUserData = () => Object.keys(data.items).length > 0 || Object.keys(data.folders).length > 0;

  /* ---------- Firebase verbinden / trennen ---------- */
  async function attach(userId, { askMerge } = {}) {
    detachListeners();
    askMergeFn = askMerge || null;
    const guest = owner === 'local' || (owner === userId && mergePending);
    if (owner !== 'local' && owner !== userId) { resetData(); cloudInit = false; mergePending = false; }
    if (owner === 'local') cloudInit = false;
    uid = userId;
    db = firebase.firestore();
    serverSeen = {};
    // Offline gesammelte Ops nachholen (nur wenn der Cache diesem Konto gehört)
    if (owner === userId && queue.length && cloudInit) {
      const ops = queue.map(q => ({ type: q.t === 'put' ? 'put' : 'del', coll: q.c, id: q.id }));
      queue = [];
      await remoteBatch(ops).catch(fsError);
    }
    if (!cloudInit) await initialSync(guest, askMerge);
    owner = userId;
    saveLocal();
    if (cloudInit) subscribeAll();
    emitSync();
  }
  function subscribeAll() {
    detachListeners();
    for (const c of COLLS) unsubs.push(ref(c).onSnapshot(snap => onSnap(c, snap), err => fsError(err)));
  }
  /** Erster Abgleich mit dem Konto. Lokale Daten werden erst ersetzt, wenn der Upload sicher geklappt hat. */
  async function initialSync(guest, askMerge) {
    try {
      await Promise.all(['items', 'folders'].map(c => ref(c).limit(1).get({ source: 'server' })));
    } catch (e) {
      console.warn('Server nicht erreichbar – Erst-Abgleich folgt, sobald online', e);
      if (e && e.code === 'permission-denied') fsError(e);
      pendingInit = true;
      mergePending = guest;
      return;
    }
    if (guest && hasUserData()) {
      if (askMerge && await askMerge()) {
        const ops = [];
        for (const c of ['folders', 'items']) for (const id of Object.keys(data[c])) ops.push({ type: 'put', coll: c, id });
        if (!await remoteBatch(ops, { wait: 20000 })) {
          pendingInit = true;
          mergePending = guest;
          toast('Hochladen ins Konto hat nicht geklappt – deine Daten bleiben auf diesem Gerät, neuer Versuch beim nächsten Start.', 'error', { duration: 6000 });
          return;
        }
      } else resetData();
    }
    pendingInit = false;
    mergePending = false;
    cloudInit = true;
  }
  function onSnap(c, snap) {
    // Leerer Cache-Snapshot beim allerersten Start würde lokale Daten kurz löschen → ignorieren
    if (snap.metadata.fromCache && snap.empty && !serverSeen[c] && Object.keys(data[c]).length) return;
    const firstServer = !snap.metadata.fromCache && !serverSeen[c];
    if (!snap.metadata.fromCache) serverSeen[c] = true;
    const next = {};
    snap.forEach(d => { next[d.id] = { ...d.data(), id: d.id }; });
    // Konto hat noch keine Einstellungen → die lokalen behalten und hochladen
    if (c === 'meta' && firstServer && !next.settings && data.meta.settings) {
      next.settings = data.meta.settings;
      setTimeout(() => put('meta', 'settings', data.meta.settings), 0);
    }
    const same = stable(next) === stable(data[c]);
    data[c] = next;
    changed(!same);
  }
  function detachListeners() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; }
  function detach() {
    detachListeners();
    uid = null; db = null; owner = 'local'; cloudInit = false; mergePending = false; pendingInit = false;
    resetData();
    saveLocal.now();
    emitSync();
  }
  async function retryInit() {
    if (!online() || !pendingInit) return;
    await initialSync(mergePending, askMergeFn);
    saveLocal();
    if (cloudInit) { subscribeAll(); emitSync(); }
  }
  function boot() {
    loadLocal();
    window.addEventListener('online', () => { emitSync(); retryInit(); });
    window.addEventListener('offline', emitSync);
  }

  return {
    boot, put, del, batch, all, raw, subscribe, settings, saveSettings,
    attach, detach, hasUserData, syncState, emitSync,
    saveNow: () => saveLocal.now(),
    onSync: cb => { syncListeners.add(cb); return () => syncListeners.delete(cb); },
    owner: () => owner
  };
})();

let lastFsErr = 0;
function fsError(e) {
  console.error('[Firestore]', e);
  if (Date.now() - lastFsErr < 4000) return;
  lastFsErr = Date.now();
  const msg = e && e.code === 'permission-denied'
    ? 'Keine Berechtigung – Firestore-Regeln prüfen (siehe README)'
    : (e && e.message) || String(e);
  toast('Sync-Fehler: ' + msg, 'error');
}

/* ==========================================================================
   4. Auth (Google-Login) & Firebase-Initialisierung
   ========================================================================== */
const Auth = (() => {
  let user = null;
  let enabled = false;
  let status = 'init'; // init | unconfigured | ready | failed
  const configured = () => {
    const k = String(FIREBASE_CONFIG.apiKey || '');
    return !!k && !k.startsWith('DEINE') && !String(FIREBASE_CONFIG.projectId || '').startsWith('DEIN');
  };
  const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  async function init() {
    if (!configured()) { status = 'unconfigured'; Store.emitSync(); return; }
    try {
      await loadScript(CDN.fbApp);
      await Promise.all([loadScript(CDN.fbAuth), loadScript(CDN.fbStore)]);
    } catch (e) {
      status = 'failed';
      Store.emitSync();
      toast('Firebase nicht erreichbar – lokaler Modus, Sync folgt beim nächsten Start', 'warn');
      return;
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      const db = firebase.firestore();
      try { await db.enablePersistence({ synchronizeTabs: true }); }
      catch (e) { console.warn('Offline-Persistence nicht verfügbar:', e.code || e); }
      enabled = true;
      status = 'ready';
      firebase.auth().getRedirectResult().catch(e => toast(authMsg(e), 'error'));
      firebase.auth().onAuthStateChanged(onUser);
    } catch (e) {
      status = 'failed';
      toast('Firebase-Fehler: ' + e.message, 'error');
    }
    Store.emitSync();
  }
  async function onUser(u) {
    if (u) {
      user = { uid: u.uid, name: u.displayName || '', email: u.email || '', photo: u.photoURL || '' };
      try { await Store.attach(u.uid, { askMerge }); } catch (e) { fsError(e); }
    } else {
      const had = !!user || Store.owner() !== 'local';
      user = null;
      if (had) Store.detach();
    }
    scheduleRender();
  }
  function askMerge() {
    const n = Store.all('items').length;
    const f = Store.all('folders').length;
    return confirmDialog({
      title: 'Lokale Daten übernehmen?',
      text: `Du hast ohne Konto ${n} ${n === 1 ? 'Eintrag' : 'Einträge'} und ${f} Ordner angelegt. Sollen sie in dein Google-Konto übernommen werden? Sonst werden sie auf diesem Gerät verworfen.`,
      okLabel: 'Übernehmen', cancelLabel: 'Verwerfen'
    });
  }
  async function signIn() {
    if (!configured()) { toast('Firebase ist noch nicht eingerichtet – siehe README', 'warn'); return; }
    if (!enabled) { toast('Firebase lädt noch oder ist offline', 'warn'); return; }
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
      await firebase.auth().signInWithPopup(provider);
    } catch (e) {
      const cancelled = ['auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/user-cancelled'].includes(e.code);
      const fallback = ['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/web-storage-unsupported', 'auth/internal-error'].includes(e.code);
      if (!cancelled && (fallback || isIOS())) {
        // iOS-Safari / Standalone-PWA: Popup scheitert oft → Redirect
        try { await firebase.auth().signInWithRedirect(provider); }
        catch (e2) { toast(authMsg(e2), 'error'); }
      } else if (!cancelled) toast(authMsg(e), 'error');
    }
  }
  async function signOut() {
    const ok = await confirmDialog({
      title: 'Abmelden?',
      text: 'Deine Daten bleiben im Konto. Die lokale Kopie auf diesem Gerät wird entfernt.',
      okLabel: 'Abmelden', danger: true
    });
    if (!ok) return;
    try { await firebase.auth().signOut(); toast('Abgemeldet'); }
    catch (e) { toast(authMsg(e), 'error'); }
  }
  function authMsg(e) {
    const map = {
      'auth/unauthorized-domain': 'Diese Domain ist in Firebase nicht autorisiert (Authentication → Settings → Authorized domains).',
      'auth/network-request-failed': 'Keine Verbindung – bitte später erneut versuchen.',
      'auth/popup-blocked': 'Popup wurde blockiert.',
      'auth/operation-not-allowed': 'Google-Login ist in Firebase nicht aktiviert.'
    };
    return 'Login-Fehler: ' + (map[e && e.code] || (e && e.message) || e);
  }
  return { init, signIn, signOut, configured, user: () => user, status: () => status };
})();

/* ==========================================================================
   5. Daten-Abfragen
   ========================================================================== */
const byNewest = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
const byChanged = (a, b) => (b.statusChangedAt || 0) - (a.statusChangedAt || 0);

const Data = {
  /** eigene Ordner in manueller Reihenfolge */
  folders: () => Store.all('folders').sort((a, b) => (a.order || 0) - (b.order || 0) || (a.createdAt || 0) - (b.createdAt || 0)),
  folder: id => FIXED[id] || Store.raw('folders', id),
  /** Ursprungsordner eines Dings – fällt auf Unsortiert zurück, wenn der Ordner fehlt */
  originId(it) {
    const f = it && it.folderId;
    return f && (f === UNSORTED || (f !== LEARNED && Store.raw('folders', f))) ? f : UNSORTED;
  },
  origin: it => Data.folder(Data.originId(it)),
  items: st => Store.all('items').filter(i => i.status === st),
  ideasIn: fid => Data.items('idea').filter(i => Data.originId(i) === fid).sort(byNewest),
  active: () => Data.items('active').sort((a, b) => (a.activeOrder || 0) - (b.activeOrder || 0) || (a.statusChangedAt || 0) - (b.statusChangedAt || 0)),
  paused: () => Data.items('paused').sort(byChanged),
  learned: () => Data.items('learned').sort(byChanged),
  discarded: () => Data.items('discarded').sort(byChanged),
  maxActiveOrder: () => Math.max(0, ...Data.items('active').map(i => i.activeOrder || 0))
};
const folderLabel = f => `${f.emoji ? f.emoji + ' ' : ''}${f.name}`;
/** ein Symbol pro Ordner: festes Icon, sonst Emoji, sonst Farbpunkt (nie beides – sonst überlappt es am iPhone) */
const folderMark = f => f.icon ? `<span class="fm">${ICON[f.icon]}</span>` : f.emoji ? `<span class="fm">${esc(f.emoji)}</span>` : '<span class="dot"></span>';
const chipHTML = f => `<span class="chip" style="--c:${COLOR[f.color] || COLOR.grau}">${folderMark(f)}<span>${esc(f.name)}</span></span>`;

/* ==========================================================================
   6. Aktionen (Änderungen an Daten)
   ========================================================================== */
const Act = {
  create({ title, folderId, active }) {
    const now = Date.now();
    const id = rid('i_');
    Store.put('items', id, {
      title, folderId, status: active ? 'active' : 'idea', notes: '', log: [],
      activeOrder: active ? Data.maxActiveOrder() + 1 : 0,
      createdAt: now, updatedAt: now, statusChangedAt: now
    });
    return id;
  },
  /** Statuswechsel mit Rückgängig-Hinweis */
  setStatus(id, status, msg) {
    const it = Store.raw('items', id);
    if (!it) return;
    const prev = clone(it);
    const now = Date.now();
    const patch = { status, statusChangedAt: now, updatedAt: now };
    // die Karte wandert woanders hin → dort zugeklappt ankommen
    if (App.openItem === id) { App.openItem = null; App.editingNotes = null; }
    if (status === 'active') patch.activeOrder = Data.maxActiveOrder() + 1;
    FX.hint(id, status);
    Store.put('items', id, patch);
    undoToast(msg(it), () => Store.put('items', id, prev, { replace: true }));
  },
  activate: id => Act.setStatus(id, 'active', it => `🔥 „${it.title}“ ist jetzt auf Start`),
  pause: id => Act.setStatus(id, 'paused', it => `⏸️ „${it.title}“ pausiert`),
  resume: id => Act.setStatus(id, 'active', it => `🔥 Weiter geht's mit „${it.title}“`),
  learned: id => Act.setStatus(id, 'learned', it => `✅ „${it.title}“ gelernt – liegt jetzt in Gelernt`),
  relearn: id => Act.setStatus(id, 'active', it => `🔁 „${it.title}“ ist wieder auf Start`),
  toIdea: id => Act.setStatus(id, 'idea', it => `💡 „${it.title}“ liegt wieder in ${folderLabel(Data.origin(it))}`),
  discard: id => Act.setStatus(id, 'discarded', it => `🗑️ „${it.title}“ verworfen`),
  restore: id => Act.setStatus(id, 'idea', it => `💡 „${it.title}“ wiederhergestellt in ${folderLabel(Data.origin(it))}`),
  async purge(id) {
    const it = Store.raw('items', id);
    if (!it) return;
    const ok = await confirmDialog({
      title: 'Endgültig löschen?',
      text: `„${it.title}“ wird mit Notizen und Logbuch gelöscht. Das lässt sich nicht rückgängig machen.`,
      okLabel: 'Endgültig löschen', danger: true
    });
    if (!ok) return;
    Store.del('items', id);
    toast('Gelöscht');
  },
  setTitle(id, title) {
    Store.put('items', id, { title, updatedAt: Date.now() }, { silent: true });
  },
  setFolder(id, folderId) {
    Store.put('items', id, { folderId, updatedAt: Date.now() });
  },
  saveLog(id, entry) {
    const it = Store.raw('items', id);
    if (!it) return;
    const log = (it.log || []).filter(e => e.id !== entry.id);
    log.push(entry);
    Store.put('items', id, { log, updatedAt: Date.now() });
  },
  deleteLog(id, logId) {
    const it = Store.raw('items', id);
    if (!it) return;
    const prevLog = clone(it.log || []);
    Store.put('items', id, { log: prevLog.filter(e => e.id !== logId), updatedAt: Date.now() });
    undoToast('Logbuch-Eintrag gelöscht', () => Store.put('items', id, { log: prevLog }));
  },
  reorderActive(ids) {
    Store.batch(ids.map((id, i) => ({ type: 'put', coll: 'items', id, doc: { activeOrder: i + 1 } })));
  },
  createFolder({ name, emoji, color }) {
    const id = rid('f_');
    const order = Math.max(0, ...Store.all('folders').map(f => f.order || 0)) + 1;
    Store.put('folders', id, { name, emoji, color, order, createdAt: Date.now() });
    return id;
  },
  moveFolder(id, dir) {
    const list = Data.folders();
    const i = list.findIndex(f => f.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    Store.batch(list.map((f, k) => ({ type: 'put', coll: 'folders', id: f.id, doc: { order: k + 1 } })));
  },
  async deleteFolder(id) {
    const f = Store.raw('folders', id);
    if (!f) return;
    const n = Data.ideasIn(id).length;
    const ok = await confirmDialog({
      title: `Ordner „${f.name}“ löschen?`,
      text: n ? `${n} ${n === 1 ? 'Idee wandert' : 'Ideen wandern'} nach 📥 Unsortiert.` : 'Der Ordner ist leer.',
      okLabel: 'Ordner löschen', danger: true
    });
    if (!ok) return;
    // Alles, was sich diesen Ordner merkt, merkt sich ab jetzt Unsortiert
    const ops = Store.all('items').filter(i => i.folderId === id)
      .map(i => ({ type: 'put', coll: 'items', id: i.id, doc: { folderId: UNSORTED } }));
    ops.push({ type: 'del', coll: 'folders', id });
    if (App.openFolder === id) App.openFolder = null;
    Store.batch(ops);
    toast('Ordner gelöscht');
  }
};

/* Notizen speichern ca. 600 ms nach dem letzten Tippen (und beim Verlassen) */
const NotesSaver = (() => {
  const pending = new Map();
  function save(id) {
    const p = pending.get(id);
    if (!p) return;
    clearTimeout(p.timer);
    pending.delete(id);
    const it = Store.raw('items', id);
    if (it && it.notes !== p.value) Store.put('items', id, { notes: p.value, updatedAt: Date.now() }, { silent: true });
  }
  return {
    schedule(id, value) {
      const p = pending.get(id);
      if (p) clearTimeout(p.timer);
      pending.set(id, { value, timer: setTimeout(() => save(id), 600) });
    },
    flush: save,
    flushAll() { [...pending.keys()].forEach(save); }
  };
})();

/* ==========================================================================
   7. App-Zustand & Rendern
   ========================================================================== */
/* ==========================================================================
   7b. Animationen (FX): Gleiten, Davonfliegen, Konfetti, Lichtwellen, Intro
   Alles über die Web Animations API – bei „Bewegung reduzieren“ aus.
   ========================================================================== */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const FX = (() => {
  const ok = () => !reduceMotion.matches && typeof Element.prototype.animate === 'function';
  const layer = () => $('#fx');
  const TAB_ORDER = ['start', 'ordner', 'mehr'];
  const COLORS_FX = ['#c8ff6a', '#7fe8ff', '#ffffff', '#ffe36e', '#c9a0ff', '#6fffc4'];
  const SPRING = 'cubic-bezier(.34,1.56,.64,1)';
  const SMOOTH = 'cubic-bezier(.2,.9,.3,1)';
  let lastTap = { x: innerWidth / 2, y: innerHeight / 2 };
  const hints = new Map(); // flip-Schlüssel → wohin die Karte fliegt

  document.addEventListener('pointerdown', e => {
    lastTap = { x: e.clientX, y: e.clientY };
    if (!ok()) return;
    // Lichtwelle auf Glas-Knöpfen
    const host = e.target.closest && e.target.closest('.btn, .tile, .pill, .tab-btn, .folder-tab-btn, .panel-toggle, .seg button, .folder-new');
    if (!host || host.disabled) return;
    const r = host.getBoundingClientRect();
    const s = Math.max(r.width, r.height) * 2.2;
    const rp = document.createElement('span');
    rp.className = 'ripple';
    rp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
    host.appendChild(rp);
    rp.animate([{ transform: 'scale(0)', opacity: .32 }, { transform: 'scale(1)', opacity: 0 }], { duration: 560, easing: SMOOTH }).onfinish = () => rp.remove();
  }, true);

  /** Elemente einer Ansicht nacheinander hereinkommen lassen */
  function collect(root) {
    const out = [];
    for (const el of root.children) {
      if (el.id === 'cabinet') out.push(...collect(el));
      else if (el.matches('.list, .cabinet')) out.push(...el.children);
      else out.push(el);
    }
    return out;
  }
  function enter(root, { dx = 0, dy = 10, base = 0, step = 38 } = {}) {
    if (!ok()) return;
    collect(root).forEach((el, i) => {
      el.animate([
        { opacity: 0, transform: `translate(${dx}px, ${dy}px) scale(.985)` },
        { opacity: 1, transform: 'none' }
      ], { duration: 480, delay: base + Math.min(i, 10) * step, easing: SMOOTH, fill: 'backwards' });
    });
  }
  /** Tab-Wechsel: Inhalt gleitet aus der passenden Richtung herein, Titel mit */
  function enterTab(view, from, to) {
    const dir = TAB_ORDER.indexOf(to) >= TAB_ORDER.indexOf(from) ? 1 : -1;
    enter(view, { dx: 16 * dir, dy: 0, step: 32 });
    if (!ok()) return;
    $('#title').animate([{ opacity: 0, transform: `translateX(${10 * dir}px)` }, { opacity: 1, transform: 'none' }], { duration: 400, easing: SMOOTH });
  }

  /* ---------- FLIP: Karten gleiten an ihren neuen Platz ---------- */
  function snap() {
    const m = new Map();
    $$('#view [data-flip]').forEach(el => {
      const hidden = !!el.closest('.folder:not(.open)');
      m.set(el.dataset.flip, { el, r: el.getBoundingClientRect(), paper: !!el.closest('.folder-inner'), hidden });
    });
    return m;
  }
  function flip(before) {
    if (!before) return;
    if (!ok()) { hints.clear(); return; }
    const seen = new Set();
    $$('#view [data-flip]').forEach(el => {
      const k = el.dataset.flip;
      seen.add(k);
      if (el.closest('.folder:not(.open)')) return;
      const b = before.get(k);
      const r = el.getBoundingClientRect();
      if (!b) {
        el.animate([{ opacity: 0, transform: 'scale(.96) translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: SMOOTH });
        return;
      }
      if (b.hidden) return;
      const dx = b.r.left - r.left, dy = b.r.top - r.top;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 480, easing: SMOOTH });
      }
      if (el.matches('.card') && Math.abs(b.r.height - r.height) > 2) {
        const prev = el.style.overflow;
        el.style.overflow = 'hidden';
        const a = el.animate([{ height: b.r.height + 'px' }, { height: r.height + 'px' }], { duration: 420, easing: SMOOTH });
        a.onfinish = a.oncancel = () => { el.style.overflow = prev; };
      }
    });
    before.forEach((b, k) => { if (!seen.has(k) && !b.hidden && b.el.matches('.card')) ghost(b, hints.get(k) || {}); });
    hints.clear();
  }
  /** Weggefallene Karte als „Geist“ wegfliegen lassen – zum Ziel-Tab, in die Pause-Sektion oder nach unten weg */
  function ghost(b, hint) {
    const { el, r } = b;
    const wrap = document.createElement('div');
    wrap.className = 'ghost' + (b.paper ? ' folder-inner' : '');
    wrap.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
    wrap.appendChild(el);
    layer().appendChild(wrap);
    let frames, opts;
    const target = hint.to ? $(`.tab-btn[data-tab="${hint.to}"] .ico`) : hint.toEl ? $(hint.toEl) : null;
    const tr = target && target.getBoundingClientRect();
    if (tr && tr.width) {
      const dx = tr.left + tr.width / 2 - (r.left + r.width / 2);
      const dy = tr.top + tr.height / 2 - (r.top + r.height / 2);
      frames = [
        { transform: 'none', opacity: 1 },
        { transform: `translate(${dx * .2}px, ${dy * .2 - 22}px) scale(.8) rotate(-2deg)`, opacity: 1, offset: .32 },
        { transform: `translate(${dx}px, ${dy}px) scale(.06) rotate(4deg)`, opacity: .2 }
      ];
      opts = { duration: 760, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' };
    } else if (hint.kind === 'discard') {
      frames = [{ transform: 'none', opacity: 1 }, { transform: 'translateY(-5px) rotate(-1deg)', opacity: 1, offset: .25 }, { transform: 'translateY(60px) rotate(5deg) scale(.9)', opacity: 0 }];
      opts = { duration: 560, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' };
    } else {
      frames = [{ transform: 'none', opacity: 1 }, { transform: 'scale(.88)', opacity: 0 }];
      opts = { duration: 340, easing: 'ease-in', fill: 'forwards' };
    }
    const a = wrap.animate(frames, opts);
    a.onfinish = () => {
      wrap.remove();
      if (hint.to) bounceTab(hint.to);
      else if (hint.toEl && target) pop(target);
    };
  }
  /** Ziel für die nächste weggefallene Karte merken (vor dem Statuswechsel aufrufen) */
  function hint(id, status) {
    const k = 'card-' + id;
    const H = {
      learned: { to: 'ordner' },
      active: { to: 'start' },
      idea: { to: 'ordner' },
      paused: { toEl: '[data-flip="paused"]' },
      discarded: { kind: 'discard' }
    };
    if (H[status]) hints.set(k, H[status]);
    if (status === 'learned') burst(lastTap.x, lastTap.y, { big: true });
    else if (status === 'active') burst(lastTap.x, lastTap.y);
  }

  /* ---------- Konfetti / Sterne / Blasen ---------- */
  function burst(x, y, { n = 10, spread = 80, big = false } = {}) {
    if (!ok()) return;
    if (big) { n = 22; spread = 130; ring(x, y); }
    for (let i = 0; i < n; i++) {
      const p = document.createElement('span');
      const kind = Math.random();
      p.className = 'pt ' + (kind < .38 ? 'star' : kind < .7 ? 'bub' : 'dot');
      const s = (kind < .38 ? 8 : kind < .7 ? 6 : 3) + Math.random() * (big ? 6 : 4);
      p.style.cssText = `left:${x}px;top:${y}px;width:${s}px;height:${s}px;--c:${COLORS_FX[i % COLORS_FX.length]}`;
      layer().appendChild(p);
      const ang = Math.random() * Math.PI * 2, dist = spread * (.35 + Math.random() * .65);
      const tx = Math.cos(ang) * dist, ty = Math.sin(ang) * dist;
      p.animate([
        { transform: 'translate(-50%,-50%) scale(.2)', opacity: 1 },
        { transform: `translate(calc(-50% + ${tx * .72}px), calc(-50% + ${ty * .72}px)) scale(1) rotate(${Math.random() * 180}deg)`, opacity: 1, offset: .42 },
        { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty + 36}px)) scale(.15) rotate(${Math.random() * 240}deg)`, opacity: 0 }
      ], { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => p.remove();
    }
  }
  function ring(x, y) {
    const r = document.createElement('span');
    r.className = 'pt-ring';
    r.style.cssText = `left:${x}px;top:${y}px`;
    layer().appendChild(r);
    r.animate([{ transform: 'translate(-50%,-50%) scale(.3)', opacity: .7 }, { transform: 'translate(-50%,-50%) scale(2.6)', opacity: 0 }], { duration: 700, easing: SMOOTH }).onfinish = () => r.remove();
  }
  function pop(el) {
    if (!ok() || !el) return;
    el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.05)' }, { transform: 'scale(1)' }], { duration: 380, easing: SMOOTH });
  }
  /** Tab-Icon wackelt wie Gelee und funkelt */
  function bounceTab(tab) {
    const ic = $(`.tab-btn[data-tab="${tab}"] .ico`);
    if (!ic || !ok()) return;
    ic.animate([
      { transform: 'scale(1)' }, { transform: 'scale(1.14, .9)' }, { transform: 'scale(.95, 1.07)' },
      { transform: 'scale(1.03, .98)' }, { transform: 'scale(1)' }
    ], { duration: 560, easing: 'ease-out' });
    const r = ic.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, { n: 6, spread: 40 });
  }
  /** Leuchtkugel fliegt vom Erfassen zum Ziel-Tab */
  function fly(from, tab) {
    const t = $(`.tab-btn[data-tab="${tab}"] .ico`);
    if (!t || !ok()) return;
    const tr = t.getBoundingClientRect();
    const o = document.createElement('span');
    o.className = 'orb';
    o.style.cssText = `left:${from.x}px;top:${from.y}px`;
    layer().appendChild(o);
    const dx = tr.left + tr.width / 2 - from.x, dy = tr.top + tr.height / 2 - from.y;
    o.animate([
      { transform: 'translate(-50%,-50%) scale(.3)', opacity: 0 },
      { transform: `translate(calc(-50% + ${dx * .3}px), calc(-50% + ${dy * .3 - 48}px)) scale(1)`, opacity: 1, offset: .35 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.35)`, opacity: .7 }
    ], { duration: 820, easing: 'cubic-bezier(.45,0,.25,1)' }).onfinish = () => { o.remove(); bounceTab(tab); };
  }

  /* ---------- Intro beim Start ---------- */
  function intro() {
    const base = ok() ? 470 : 0;
    if (ok()) {
      const s = document.createElement('div');
      s.id = 'splash';
      s.innerHTML = '<img src="icon-512.png" alt="">';
      document.body.appendChild(s);
      setTimeout(() => { s.classList.add('out'); setTimeout(() => s.remove(), 450); }, 460);
      $('#title').animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 520, delay: base, easing: SMOOTH, fill: 'backwards' });
      $('.tabbar-inner').animate([{ opacity: 0, transform: 'translateY(40%)' }, { opacity: 1, transform: 'none' }], { duration: 620, delay: base + 100, easing: SMOOTH, fill: 'backwards' });
      $('#fab').animate([{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'none' }], { duration: 560, delay: base + 260, easing: SMOOTH, fill: 'backwards' });
    }
    enter($('#view'), { base: base + 80 });
  }

  /** Gleitendes Glas-Leuchten in der Tab-Leiste */
  function moveTabGlow(tab) {
    const inner = $('.tabbar-inner');
    if (inner) inner.style.setProperty('--tab-i', TAB_ORDER.indexOf(tab));
  }

  return { snap, flip, enter, enterTab, hint, burst, bounceTab, fly, intro, moveTabGlow, pop, ok, lastTap: () => lastTap };
})();

const App = {
  tab: 'start',
  openItem: null,       // aufgeklappte Karte
  openFolder: null,     // geöffneter Ordner im Hängeregister
  query: '',            // Suche im Ordner-Tab
  pausedOpen: false,
  discardedOpen: false,
  editingNotes: null,   // Ding, dessen Notizzettel gerade bearbeitet wird
  renderedTab: null
};
const TITLES = { start: 'Start', ordner: 'Ordner', mehr: 'Mehr' };

let renderQueued = false;
let renderPending = false;
/** Tippt der Nutzer gerade in einem Feld der Ansicht? Dann nicht neu zeichnen. */
function isTyping() {
  const a = document.activeElement;
  return !!(a && a.closest && a.closest('#view') && a.matches('textarea, input:not([type=search]):not([type=checkbox])'));
}
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  // setTimeout statt requestAnimationFrame: läuft auch, wenn der Tab im Hintergrund ist
  setTimeout(() => {
    renderQueued = false;
    if (isTyping()) { renderPending = true; return; }
    render();
  }, 0);
}
document.addEventListener('focusout', () => {
  if (!renderPending) return;
  // kurz warten, damit ein gerade angetippter Knopf seinen Klick noch bekommt
  setTimeout(() => { if (renderPending && !isTyping()) { renderPending = false; render(); } }, 260);
});

function render() {
  renderPending = false;
  const view = $('#view');
  const prevTab = App.renderedTab;
  const tabChanged = prevTab !== App.tab;
  const before = tabChanged ? null : FX.snap();
  if (tabChanged) {
    view.innerHTML = '';
    view._key = null;
    App.renderedTab = App.tab;
    window.scrollTo(0, 0);
  }
  $('#title').textContent = TITLES[App.tab];
  document.body.dataset.tab = App.tab; // Hintergrund je Tab (wie im Mockup)
  $$('.tab-btn').forEach(b => {
    const on = b.dataset.tab === App.tab;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#fab').hidden = App.tab === 'mehr';
  FX.moveTabGlow(App.tab);
  ({ start: viewStart, ordner: viewOrdner, mehr: viewMehr })[App.tab](view);
  if (tabChanged) { if (prevTab) FX.enterTab(view, prevTab, App.tab); }
  else FX.flip(before);
}

/** DOM nur ersetzen, wenn sich das HTML geändert hat – laufende Animationen bleiben ungestört */
function setHTML(el, html, key = html) {
  if (el._key === key) return false;
  el.innerHTML = html;
  el._key = key;
  return true;
}

/* ---------- Karten ---------- */
/** Aktions-Kacheln je Zustand: [Aktion, Beschriftung, Icon, Art] */
const TILES = {
  idea: [['activate', 'Jetzt lernen', 'play', 'wide primary'], ['discard', 'Verwerfen', 'trash', '']],
  active: [['pause', 'Pausieren', 'pause', ''], ['learned', 'Gelernt', 'check', 'good'], ['to-idea', 'Zu Ideen', 'undo', ''], ['discard', 'Verwerfen', 'trash', '']],
  paused: [['resume', 'Weiterlernen', 'play', 'primary'], ['learned', 'Gelernt', 'check', 'good'], ['to-idea', 'Zu Ideen', 'undo', ''], ['discard', 'Verwerfen', 'trash', '']],
  learned: [['relearn', 'Nochmal lernen', 'repeat', 'wide primary'], ['discard', 'Verwerfen', 'trash', '']]
};
const SINCE = { idea: 'Idee seit', active: 'Aktiv seit', paused: 'Pausiert seit', learned: 'Gelernt am' };

function cardHTML(it, { chip = true, handle = false, i = 0 } = {}) {
  const open = App.openItem === it.id;
  const meta = [];
  if (chip) meta.push(chipHTML(Data.origin(it)));
  if (it.status === 'learned') meta.push(`<span>gelernt am ${fmtTs(it.statusChangedAt)}</span>`);
  return `<article class="card ${open ? 'open' : ''}" data-id="${it.id}" data-flip="card-${it.id}" style="--i:${i}">
    <div class="card-head" data-action="toggle-card" data-id="${it.id}" role="button" tabindex="0" aria-expanded="${open}">
      ${handle ? '<span class="handle" aria-label="Zum Umsortieren ziehen" title="Ziehen zum Umsortieren">⋮⋮</span>' : ''}
      <div class="card-main">
        <div class="card-title">${esc(it.title)}</div>
        ${meta.length ? `<div class="card-meta">${meta.join('')}</div>` : ''}
      </div>
      <span class="chev" aria-hidden="true">›</span>
    </div>
    ${open ? cardBodyHTML(it) : ''}
  </article>`;
}

function cardBodyHTML(it) {
  const st = it.status;
  const f = Data.origin(it);
  const folderOpts = [FIXED[UNSORTED], ...Data.folders()]
    .map(x => `<option value="${x.id}" ${Data.originId(it) === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  const tiles = TILES[st] || [];
  const wide = tiles.some(t => t[3].includes('wide'));
  const log = [...(it.log || [])].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
  const showLog = st !== 'idea' || log.length > 0;
  return `<div class="card-body">
    <div class="cb-meta">
      <label class="pill folder-pill" style="--c:${COLOR[f.color] || COLOR.grau}" title="${st === 'idea' ? 'Ordner' : 'Ursprungsordner'}">
        ${folderMark(f)}<select class="f-folder" data-id="${it.id}" aria-label="Ordner">${folderOpts}</select><span class="caret"></span></label>
      <button class="pill" data-action="rename" data-id="${it.id}">${ICON.pencil}Umbenennen</button>

/* Glitzer-Partikel rund um den Spross (feste Zufallsverteilung) */
const SPECKS = (() => {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let s = '';
  for (let n = 0; n < 70; n++) {
    const lower = n >= 58;
    const x = lower ? -6 + rnd() * 110 : -8 + rnd() * 356;
    const y = lower ? 340 + rnd() * 80 : 36 + rnd() * 250;
    if (!lower && x > 74 && x < 262 && y > 96 && y < 250) continue; // nicht auf dem Spross
    const dot = rnd() < .35;
    const w = dot ? 2 + rnd() * 1.5 : 1.4 + rnd() * 1.6;
    const h = dot ? w : 3.5 + rnd() * 5;
    s += `<span class="speck" style="--x:${x.toFixed(1)}px;--y:${y.toFixed(1)}px;--w:${w.toFixed(1)}px;--h:${h.toFixed(1)}px;--r:${(-40 + rnd() * 80).toFixed(0)}deg;--o:${(.35 + rnd() * .6).toFixed(2)};--delay:-${(rnd() * 7).toFixed(1)}s"></span>`;
  }
  return s;
})();
function viewStart(view) {
  const act = Data.active();
  const pau = Data.paused();
  let h = '';
  const grow = !(view._key || '').includes('empty-state');
  document.body.classList.toggle('start-empty', !act.length);
  if (!act.length) {
    h += `<div class="empty-state __GROW__"><div class="specks" aria-hidden="true">${SPECKS}</div><div class="sprout-wrap"><span class="sprout-shadow"></span><img class="sprout-img" src="sprout.png" alt="" width="192" height="160"><span class="spark" style="--x:22px;--y:58px;--s:22px;--d:3.4s;--delay:-.6s"></span><span class="spark" style="--x:114px;--y:3px;--s:20px;--d:3.9s;--delay:-2s"></span></div><p>Du lernst gerade nichts.</p>
      <button class="btn primary" data-action="goto-ordner">${ICON.glassFolder}Schau in deine Ideen</button></div>`;
  } else {

/* ---------- Ordner-Grafik (wie im Mockup): Farben + SVG-Rückwand mit Reiter ---------- */
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h /= 6;
  }
  return [h * 360, s * 100, l * 100];
}
const hsl = (h, s, l) => `hsl(${h.toFixed(0)} ${Math.max(0, Math.min(100, s)).toFixed(0)}% ${Math.max(0, Math.min(100, l)).toFixed(0)}%)`;
/** Farbtöne einer Mappe aus der Grundfarbe ableiten (gemessen an Gelernt/Unsortiert im Mockup) */
function folderVars(hex) {
  const [h, s, l] = hexToHsl(hex);
  return `--f-tab1:${hsl(h, s + 4, l + 12)};--f-tab2:${hsl(h, s, l - 3)};--f-back:${hsl(h, s, l - 12)};` +
    `--f-front1:${hsl(h, s, l + 1)};--f-front2:${hsl(h, s, l - 7)};--f-front3:${hsl(h, s - 4, l - 19)}`;
}
/** feste Palette (gemessen) als CSS-Variablen */
const palVars = p => ['tab1', 'tab2', 'back', 'front1', 'front2', 'front3'].map((k, i) => `--f-${k}:${p[i]}`).join(';');
const TAB_FRAC = [0, .19, .4];
/** Rückwand mit Reiter als SVG-Pfad zeichnen – passend zur echten Breite und Reiter-Beschriftung */
function drawFolders() {
  const F = 15, PAD = 6, YB = 30, H = 72;
  $$('#cabinet .folder').forEach((sec, i) => {
    const W = sec.clientWidth;
    const tab = $('.folder-tab', sec);
    const art = $('.folder-art', sec);
    if (!W || !tab || !art) return;
    const tw = tab.scrollWidth;
    const first = i % 3 === 0;
    let path, x0;
    if (first) {
      x0 = 14;
      const topR = x0 + tw + PAD + 2, b = topR + F;
      path = `M0 ${H}V11Q0 0 11 0H${topR}C${topR + F * .45} 0 ${topR + F * .55} ${YB} ${b} ${YB}H${W - 9}Q${W} ${YB} ${W} ${YB + 9}V${H}Z`;
    } else {
      let a = Math.round(W * TAB_FRAC[i % 3]);
      a = Math.max(0, Math.min(a, W - (tw + 2 * PAD + 2 * F) - 8));
      const topL = a + F;
      x0 = topL + PAD;
      const topR = x0 + tw + PAD, b = topR + F;
      path = `M0 ${H}V${YB + 9}Q0 ${YB} 9 ${YB}H${a}C${a + F * .55} ${YB} ${a + F * .45} 0 ${topL} 0H${topR}C${topR + F * .45} 0 ${topR + F * .55} ${YB} ${b} ${YB}H${W - 9}Q${W} ${YB} ${W} ${YB + 9}V${H}Z`;
    }
    tab.style.left = x0 + 'px';
    const id = 'fa' + i;
    art.setAttribute('viewBox', `0 0 ${W} ${H}`);
    art.innerHTML = `<defs>
        <linearGradient id="${id}g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${H}">
          <stop offset="0" style="stop-color:var(--f-tab1)"/><stop offset="${((YB - 4) / H).toFixed(3)}" style="stop-color:var(--f-tab2)"/><stop offset="${((YB + 6) / H).toFixed(3)}" style="stop-color:var(--f-back)"/><stop offset="1" style="stop-color:var(--f-back)"/></linearGradient>
        <linearGradient id="${id}s" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${YB}">
          <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".48" stop-color="#fff" stop-opacity=".1"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <path d="${path}" fill="url(#${id}g)"/>
      <path d="${path}" fill="url(#${id}s)"/>
      <path d="${path}" fill="none" stroke="#fff" stroke-opacity=".62" stroke-width="1.3"/>`;
  });
}
window.addEventListener('resize', debounce(() => { if (App.tab === 'ordner') drawFolders(); }, 120));

  }).join('')}

  if (changed) drawFolders();

function openCapture() {

    ? App.openFolder : UNSORTED;
  const opts = [FIXED[UNSORTED], ...Data.folders()]
    .map(f => `<option value="${f.id}" ${f.id === pre ? 'selected' : ''}>${esc(folderLabel(f))}</option>`).join('');
  openSheet({
    title: 'Was willst du lernen?',
    body: `<input class="input big-input" id="cap-title" placeholder="z. B. Gitarre spielen" maxlength="120" enterkeyhint="done" autocomplete="off">

        <button class="btn" data-k="cancel">Abbrechen</button>

      <div class="sheet-actions"><span class="grow"></span>
        <button class="btn" data-k="cancel">Abbrechen</button>
        <button class="btn primary" data-k="save">${folder ? 'Speichern' : 'Anlegen'}</button></div>`,
    onMount(sheet, close) {
      const name = $('#fo-name', sheet);
      const emoji = $('#fo-emoji', sheet);
      if (!folder) name.focus();
      sheet.addEventListener('click', e => {
        const sw = e.target.closest('[data-color]');
        if (sw) {
          color = sw.dataset.color;
          $$('.swatch', sheet).forEach(b => b.classList.toggle('on', b === sw));
        }
        const em = e.target.closest('[data-emoji]');
        if (em) emoji.value = emoji.value === em.dataset.emoji ? '' : em.dataset.emoji;
      });
      const save = () => {
        const n = name.value.trim();
        if (!n) { name.focus(); toast('Bitte einen Namen eingeben', 'warn'); return; }
        const doc = { name: n, emoji: firstGrapheme(emoji.value), color };
        if (folder) Store.put('folders', folder.id, doc);
        else {
          App.openFolder = Act.createFolder(doc);
          App.query = '';
        }
        close();
        scheduleRender();
      };
      name.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
      $('[data-k=save]', sheet).addEventListener('click', save);
      $('[data-k=cancel]', sheet).addEventListener('click', close);
    }
  });
}

/* ==========================================================================
   9. Backup
   ========================================================================== */
function exportBackup() {
  const payload = {
    app: 'lifeio', version: 1, exportedAt: new Date().toISOString(),
    folders: Store.all('folders'), items: Store.all('items'), settings: Store.settings()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lifeio-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Backup exportiert');
}

async function importBackup(file) {
  let o;
  try { o = JSON.parse(await file.text()); }
  catch (e) { toast('Die Datei ist kein gültiges JSON', 'error'); return; }
  if (!o || o.app !== 'lifeio' || !Array.isArray(o.folders) || !Array.isArray(o.items)) {
    toast('Das ist kein Lifeio-Backup', 'error');
    return;
  }
  const folders = o.folders.filter(f => f && typeof f.id === 'string' && f.id && !FIXED[f.id] && typeof f.name === 'string')
    .map(f => ({ ...f, color: COLOR[f.color] ? f.color : 'grau', emoji: typeof f.emoji === 'string' ? f.emoji : '' }));
  const items = o.items.filter(i => i && typeof i.id === 'string' && i.id && typeof i.title === 'string')
    .map(i => ({
      ...i,
      status: STATUSES.includes(i.status) ? i.status : 'idea',
      notes: typeof i.notes === 'string' ? i.notes : '',
      log: Array.isArray(i.log) ? i.log.filter(e => e && typeof e.text === 'string' && isISO(e.date)) : []
    }));
  const when = o.exportedAt ? ` vom ${fmtTs(Date.parse(o.exportedAt))}` : '';
  const ok = await confirmDialog({
    title: 'Backup importieren?',
    text: `Backup${when} mit ${items.length} ${items.length === 1 ? 'Eintrag' : 'Einträgen'} und ${folders.length} ${folders.length === 1 ? 'Ordner' : 'Ordnern'}. Alle aktuellen Daten werden ersetzt.`,
    okLabel: 'Importieren', danger: true
  });
  if (!ok) return;
  const keepF = new Set(folders.map(f => f.id));
  const keepI = new Set(items.map(i => i.id));
  const ops = [
    ...Store.all('folders').filter(f => !keepF.has(f.id)).map(f => ({ type: 'del', coll: 'folders', id: f.id })),
    ...Store.all('items').filter(i => !keepI.has(i.id)).map(i => ({ type: 'del', coll: 'items', id: i.id })),
    ...folders.map(f => ({ type: 'put', coll: 'folders', id: f.id, doc: f, replace: true })),
    ...items.map(i => ({ type: 'put', coll: 'items', id: i.id, doc: i, replace: true }))
  ];
  App.openItem = null;
  App.openFolder = null;
  await Store.batch(ops);
  if (o.settings && ['auto', 'light', 'dark'].includes(o.settings.theme)) Store.saveSettings({ theme: o.settings.theme });
  toast('Backup importiert');
}

/* ==========================================================================
   10. Darstellung (Hell / Dunkel / Automatisch)
   ========================================================================== */
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = Store.settings().theme;
  const root = document.documentElement;
  if (t === 'light' || t === 'dark') root.dataset.theme = t; else delete root.dataset.theme;
  try { localStorage.setItem(LS.theme, t); } catch (e) {}
  const dark = t === 'dark' || (t !== 'light' && darkMQ.matches);
  $('meta[name=theme-color]').setAttribute('content', dark ? '#0a3760' : '#2aa7ee');
}
darkMQ.addEventListener && darkMQ.addEventListener('change', applyTheme);

/* ==========================================================================
   11. Ereignisse
   ========================================================================== */
const Actions = {
  tab(el) {
    const t = el.dataset.tab;
    if (t === App.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    App.tab = t;
    App.openItem = null;
    App.editingNotes = null;
    render();
    FX.bounceTab(t);
  },
  'goto-ordner'() { App.tab = 'ordner'; App.openItem = null; render(); },
  capture() {
    const f = $('#fab');
    f.classList.remove('spin'); void f.offsetWidth; f.classList.add('spin');
    openCapture();
  },
  'toggle-card'(el) {
    const id = el.dataset.id;
    App.openItem = App.openItem === id ? null : id;
    App.editingNotes = null;
    render();
    if (App.openItem) {
      const card = $(`.card[data-id="${id}"]`);
      if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  },
  activate: el => Act.activate(el.dataset.id),
  pause: el => Act.pause(el.dataset.id),
  resume: el => Act.resume(el.dataset.id),
  learned: el => Act.learned(el.dataset.id),
  relearn: el => Act.relearn(el.dataset.id),
  'to-idea': el => Act.toIdea(el.dataset.id),
  restore: el => Act.restore(el.dataset.id),
  purge: el => Act.purge(el.dataset.id),
  discard: el => Act.discard(el.dataset.id),
  rename: el => openRenameSheet(el.dataset.id),
  async 'card-more'(el) {
    const k = await actionSheet('', [{ key: 'discard', label: '🗑️ Verwerfen', danger: true }]);
    if (k === 'discard') Act.discard(el.dataset.id);
  },
  'edit-notes'(el) {
    const it = Store.raw('items', el.dataset.id);
    if (!it) return;
    App.editingNotes = it.id;
    el.outerHTML = notesEditHTML(it);
    const ta = $(`textarea.notes-edit[data-id="${it.id}"]`);
    autosize(ta);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  },
  'add-log': el => openLogSheet(el.dataset.id),
  'edit-log': el => openLogSheet(el.dataset.id, el.dataset.log),
  'toggle-paused'() { App.pausedOpen = !App.pausedOpen; render(); },
  'toggle-discarded'() { App.discardedOpen = !App.discardedOpen; render(); },
  'toggle-folder'(el) {
    const id = el.dataset.id;
    // offene Karte zuklappen, damit ein Ordner immer mit geschlossenen Karten aufgeht
    if (App.openItem) { App.openItem = null; App.editingNotes = null; renderCabinet(); }
    App.openFolder = App.openFolder === id ? null : id;
    // Klassen direkt umschalten (nicht neu zeichnen) → Ordner gleiten auf/zu, die dahinter rutschen nach
    $$('#cabinet .folder').forEach(s => {
      const on = s.dataset.folder === App.openFolder;
      if (on && !s.classList.contains('open')) {
        s.classList.add('just-opened');
        clearTimeout(s._jo);
        s._jo = setTimeout(() => s.classList.remove('just-opened'), 1400);
      }
      s.classList.toggle('open', on);
      $('.folder-tab-btn', s).setAttribute('aria-expanded', on);
    });
    drawFolders();
    if (App.openFolder) {
      setTimeout(() => {
        const s = $(`#cabinet .folder[data-folder="${App.openFolder}"]`);
        if (!s) return;
        const top = s.getBoundingClientRect().top;
        if (top < 120 || top > window.innerHeight * .55) s.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }, 400);
    }
  },
  async 'folder-menu'(el) {
    const id = el.dataset.id;
    const list = Data.folders();
    const i = list.findIndex(f => f.id === id);
    const f = list[i];
    if (!f) return;
    const k = await actionSheet(folderLabel(f), [
      { key: 'edit', label: '✏️ Bearbeiten' },
      { key: 'up', label: '⬆️ Nach oben', disabled: i === 0 },
      { key: 'down', label: '⬇️ Nach unten', disabled: i === list.length - 1 },
      { key: 'delete', label: '🗑️ Ordner löschen', danger: true }
    ]);
    if (k === 'edit') openFolderSheet(f);
    else if (k === 'up') Act.moveFolder(id, -1);
    else if (k === 'down') Act.moveFolder(id, 1);
    else if (k === 'delete') Act.deleteFolder(id);
  },
  'new-folder'() { openFolderSheet(null); },
  'clear-search'() {
    App.query = '';
    const s = $('#search');
    if (s) s.value = '';
    renderCabinet();
  },
  'sign-in'() { Auth.signIn(); },
  'sign-out'() { Auth.signOut(); },
  export() { exportBackup(); },
  import() { const f = $('#import-file'); if (f) f.click(); },
  theme(el) { Store.saveSettings({ theme: el.dataset.theme }); applyTheme(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !$('#app').contains(el)) return;
  if (e.target.closest('.handle') || e.target.closest('a')) return;
  const fn = Actions[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('.card-head') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); Actions['toggle-card'](t); }
  if (t.matches && t.matches('.f-title') && e.key === 'Enter') { e.preventDefault(); t.blur(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'search') { App.query = t.value; renderCabinet(); }
  else if (t.matches('textarea.notes-edit')) { autosize(t); NotesSaver.schedule(t.dataset.id, t.value); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('.f-title')) {
    const it = Store.raw('items', t.dataset.id);
    if (!it) return;
    const v = t.value.trim();
    if (!v) { t.value = it.title; return; }
    if (v !== it.title) {
      Act.setTitle(it.id, v);
      const head = t.closest('.card') && $('.card-title', t.closest('.card'));
      if (head) head.textContent = v;
    }
  } else if (t.matches('.f-folder')) {
    const it = Store.raw('items', t.dataset.id);
    if (!it) return;
    const fid = t.value;
    // Eine Idee „wandert“ mit – der Zielordner geht auf, damit die Karte sichtbar bleibt
    if (it.status === 'idea' && App.tab === 'ordner' && !App.query && App.openFolder === Data.originId(it)) App.openFolder = fid;
    Act.setFolder(it.id, fid);
    if (it.status === 'idea') toast(`Verschoben nach ${folderLabel(Data.folder(fid))}`);
  } else if (t.id === 'import-file') {
    const f = t.files && t.files[0];
    t.value = '';
    if (f) importBackup(f);
  }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (!t.matches || !t.matches('textarea.notes-edit')) return;
  const id = t.dataset.id;
  NotesSaver.flush(id);
  if (App.editingNotes === id) App.editingNotes = null;
  const it = Store.raw('items', id);
  if (!it || !t.isConnected) return;
  // Höhe kurz halten, damit nichts verrutscht, während ein Knopf darunter angetippt wird
  const h = t.offsetHeight;
  t.outerHTML = notesViewHTML(it);
  const v = $(`.notes-view[data-id="${id}"]`);
  if (v) { v.style.minHeight = h + 'px'; setTimeout(() => { v.style.minHeight = ''; }, 450); }
});

/* Umsortieren der aktiven Skills per Ziehgriff */
document.addEventListener('pointerdown', e => {
  const handle = e.target.closest && e.target.closest('.handle');
  if (!handle || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const card = handle.closest('.card');
  const list = card && card.parentElement;
  if (!list || !list.dataset.list) return;
  const cards = $$(':scope > .card', list);
  if (cards.length < 2) return;
  e.preventDefault();
  const idx = cards.indexOf(card);
  const rects = cards.map(c => c.getBoundingClientRect());
  const centers = rects.map(r => r.top + r.height / 2);
  const gap = parseFloat(getComputedStyle(list).rowGap) || 10;
  const shift = rects[idx].height + gap;
  const startY = e.clientY;
  let target = idx;
  card.classList.add('dragging');
  list.classList.add('drag-active');
  try { handle.setPointerCapture(e.pointerId); } catch (err) {}
  const onMove = ev => {
    const dy = ev.clientY - startY;
    card.style.transform = `translateY(${dy}px)`;
    // Maßgeblich ist die Fingerposition am Griff (auch bei hohen, aufgeklappten Karten)
    const c = ev.clientY;
    target = idx;
    for (let i = 0; i < idx; i++) if (c < centers[i]) { target = i; break; }
    if (target === idx) for (let i = cards.length - 1; i > idx; i--) if (c > centers[i]) { target = i; break; }
    cards.forEach((el, i) => {
      if (i === idx) return;
      let s = 0;
      if (idx < target && i > idx && i <= target) s = -shift;
      if (idx > target && i < idx && i >= target) s = shift;
      el.style.transform = s ? `translateY(${s}px)` : '';
    });
  };
  const onUp = () => {
    handle.removeEventListener('pointermove', onMove);
    handle.removeEventListener('pointerup', onUp);
    handle.removeEventListener('pointercancel', onUp);
    card.classList.remove('dragging');
    list.classList.remove('drag-active');
    // bei Umsortierung Transforms stehen lassen: render() misst sie und lässt die Karte weich einrasten
    if (target === idx) cards.forEach(el => { el.style.transform = ''; });
    if (target !== idx) {
      const ids = cards.map(c => c.dataset.id);
      const [m] = ids.splice(idx, 1);
      ids.splice(target, 0, m);
      Act.reorderActive(ids);
    }
  };
  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onUp);
  handle.addEventListener('pointercancel', onUp);
});

/* Beim Verlassen nichts verlieren */
function saveAll() { NotesSaver.flushAll(); Store.saveNow(); }
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { saveAll(); hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000 && App.openItem && !isTyping()) {
    App.openItem = null;
    App.editingNotes = null;
    render();
  }
});
window.addEventListener('pagehide', saveAll);

/* ==========================================================================
   12. Service Worker & Start
   ========================================================================== */
function registerSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = sw => toast('Neue Version verfügbar', 'info', { duration: 20000, action: { label: 'Neu laden', fn: () => sw.postMessage({ type: 'SKIP_WAITING' }) } });
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      if (!sw) return;
      sw.addEventListener('statechange', () => { if (sw.state === 'installed' && navigator.serviceWorker.controller) offer(sw); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(e => console.warn('Service Worker:', e));
}

/* Icons, Hintergrund-Ebenen und Tropfen einsetzen (Positionen wie im Mockup, 375 px breit gemessen) */
function buildDecor() {
  document.body.insertAdjacentHTML('afterbegin', ICON_DEFS);
  $$('[data-icon]').forEach(el => { el.innerHTML = ICON[el.dataset.icon]; });
  $('#fab').innerHTML = ICON.plus;
  const X = x => `calc(50% - 187.5px + ${x}px)`;
  const dots = [[228, 28, 3, .9], [263, 38, 2, .7], [284, 74, 2.5, .8], [326, 60, 2, .6], [357, 91, 3, .8], [241, 112, 2, .6], [311, 147, 2.5, .7], [350, 20, 2, .6], [300, 110, 1.5, .5], [196, 18, 2, .5]]
    .map(([x, y, s, o]) => `<span class="dot" style="--x:${X(x)};--y:${y}px;--s:${s}px;--o:${o}"></span>`).join('');
  const rises = [[8, 10, 24, -3], [22, 6, 19, -11], [37, 14, 31, -19], [52, 5, 17, -6], [66, 9, 27, -23], [79, 12, 22, -14], [92, 7, 29, -2]]
    .map(([x, s, d, dl]) => `<span class="rise" style="--x:${x}%;--s:${s}px;--d:${d}s;--delay:${dl}s"></span>`).join('');
  $('.tabbar-inner').insertAdjacentHTML('afterbegin', '<span class="tab-glow" aria-hidden="true"></span>');
  $('.bg').innerHTML = `<div class="bgl bgl-start"></div><div class="bgl bgl-mehr"></div><div class="bgl bgl-ordner"></div>${rises}<div class="halo"></div><div class="flare"></div><div class="arc a1"></div><div class="arc a2"></div><div class="ordner-dots">${dots}</div>`;
  const drop = (tab, x, b, s, k = 1, r = 0) => `<span class="drop on-${tab}" style="--x:${X(x)};--b:${b}px;--s:${s}px;--k:${k};--r:${r}deg;--w:${(4 + (x % 5) * .7).toFixed(1)}s"></span>`;
  $('.drops').innerHTML = [
    drop('start', 14, 202, 22), drop('start', 26, 146, 12), drop('start', 54, 124, 36, .74, -22), drop('start', 88, 168, 9),
    drop('start', 95, 83, 19), drop('start', 103, 4, 23), drop('start', 58, 255, 5), drop('start', 84, 285, 4),
    drop('mehr', 118, 79, 8), drop('mehr', 98, 16, 14), drop('mehr', 241, 37, 8), drop('mehr', 263, 55, 5), drop('mehr', 353, 83, 10), drop('mehr', 265, 20, 7)
  ].join('');
}

/** Popups bleiben im sichtbaren Bereich zentriert – auch wenn die Tastatur offen ist */
function trackVisualViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const upd = () => {
    const r = document.documentElement.style;
    r.setProperty('--vv-h', vv.height + 'px');
    r.setProperty('--vv-top', vv.offsetTop + 'px');
  };
  vv.addEventListener('resize', upd);
  vv.addEventListener('scroll', upd);
  upd();
}

function boot() {
  buildDecor();
  trackVisualViewport();
  Store.boot();
  applyTheme();
  Store.subscribe(() => { applyTheme(); scheduleRender(); });
  Store.onSync(() => { if (App.tab === 'mehr') scheduleRender(); });
  render();
  FX.intro();
  Auth.init();
  registerSW();
}
boot();
})();
