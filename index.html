<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a3760">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lifeio">
<meta name="description" content="Lifeio – Ideen sammeln und verwalten, was du in deiner Freizeit lernst.">
<title>Lifeio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  /* Design sofort setzen (kein Aufblitzen im falschen Modus) */
  try { const t = localStorage.getItem('lifeio-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ==========================================================================
   1. Design-Tokens – Frutiger Aero
      Dunkel = Ozean-Aurora (wie die Mockups), Hell = Himmel
   ========================================================================== */
:root {
  color-scheme: dark;
  --text: #ffffff;
  --text-dim: rgba(232, 248, 255, .8);
  --text-shadow: 0 1px 2px rgba(0, 20, 40, .55);
  --title: #ffffff;
  --title-shadow: 0 2px 6px rgba(0, 15, 35, .55);
  --link: #a8ecff;
  --tab-active: #cfe3f2;
  --tab-text: #ffffff;
  --tab-text-shadow: 0 1px 2px rgba(0, 25, 45, .6);
  --danger-text: #ffc2c8;

  --glass-tint: rgba(205, 230, 245, .13);
  --glass-hi: rgba(220, 240, 255, .30);
  --glass-border: rgba(225, 245, 255, .55);
  --glass-shadow: 0 8px 22px rgba(0, 10, 30, .4);
  --field-bg: rgba(255, 255, 255, .12);
  --field-border: rgba(255, 255, 255, .32);
  --field-text: #ffffff;
  --placeholder: rgba(240, 250, 255, .85);
  --inset-bg: rgba(0, 25, 45, .3);
  --inset-border: rgba(255, 255, 255, .16);
  --btn-text: #ffffff;
  --sheet-bg: linear-gradient(180deg, rgba(26, 92, 128, .94), rgba(6, 36, 64, .97));
  --toast-bg: rgba(6, 34, 58, .86);
  --aurora-opacity: 1;

  --radius: 19px;
  --tabbar-h: 86px;
  --tabbar-bottom: 13px;
}
html[data-theme="light"] {
  color-scheme: light;
  --text: #0b3550;
  --text-dim: rgba(11, 53, 80, .74);
  --text-shadow: 0 1px 0 rgba(255, 255, 255, .55);
  --title: #ffffff;
  --title-shadow: 0 2px 10px rgba(0, 90, 160, .55), 0 1px 2px rgba(0, 70, 130, .6);
  --link: #0a6ed1;
  --tab-active: #0a6ed1;
  --tab-text: #0b3550;
  --tab-text-shadow: 0 1px 0 rgba(255, 255, 255, .6);
  --danger-text: #c0182b;
  --glass-tint: rgba(255, 255, 255, .42);
  --glass-hi: rgba(255, 255, 255, .78);
  --glass-border: rgba(255, 255, 255, .92);
  --glass-shadow: 0 10px 28px rgba(0, 80, 140, .22);
  --field-bg: rgba(255, 255, 255, .7);
  --field-border: rgba(0, 90, 140, .22);
  --field-text: #0b3550;
  --placeholder: rgba(11, 53, 80, .55);
  --inset-bg: rgba(255, 255, 255, .55);
  --inset-border: rgba(0, 90, 140, .14);
  --btn-text: #0b3550;
  --sheet-bg: linear-gradient(180deg, rgba(242, 252, 255, .95), rgba(212, 241, 255, .97));
  --toast-bg: rgba(8, 60, 95, .9);
  --aurora-opacity: .55;
}
@media (prefers-color-scheme: light) {
  html:not([data-theme="dark"]) {
    color-scheme: light;
    --text: #0b3550;
    --text-dim: rgba(11, 53, 80, .74);
    --text-shadow: 0 1px 0 rgba(255, 255, 255, .55);
    --title: #ffffff;
    --title-shadow: 0 2px 10px rgba(0, 90, 160, .55), 0 1px 2px rgba(0, 70, 130, .6);
    --link: #0a6ed1;
    --tab-active: #0a6ed1;
  --tab-text: #0b3550;
  --tab-text-shadow: 0 1px 0 rgba(255, 255, 255, .6);
    --danger-text: #c0182b;
    --glass-tint: rgba(255, 255, 255, .42);
    --glass-hi: rgba(255, 255, 255, .78);
    --glass-border: rgba(255, 255, 255, .92);
    --glass-shadow: 0 10px 28px rgba(0, 80, 140, .22);
    --field-bg: rgba(255, 255, 255, .7);
    --field-border: rgba(0, 90, 140, .22);
    --field-text: #0b3550;
    --placeholder: rgba(11, 53, 80, .55);
    --inset-bg: rgba(255, 255, 255, .55);
    --inset-border: rgba(0, 90, 140, .14);
    --btn-text: #0b3550;
    --sheet-bg: linear-gradient(180deg, rgba(242, 252, 255, .95), rgba(212, 241, 255, .97));
    --toast-bg: rgba(8, 60, 95, .9);
    --aurora-opacity: .55;
  }
}

/* ==========================================================================
   2. Grundlayout & Hintergrund (je Tab eigener Ozean-Verlauf wie im Mockup)
   ========================================================================== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: #01203f; scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
body {
  margin: 0;
  color: var(--text);
  text-shadow: var(--text-shadow);
  background: transparent;
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
a { color: var(--link); }
svg { display: block; }

.bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  /* Start: links Marine, Mitte Aurora, unten grün */
  background:
    radial-gradient(75% 26% at 42% 86%, rgba(10, 128, 96, .95), transparent 75%),
    radial-gradient(40% 26% at 0% 86%, rgba(13, 66, 62, .95), transparent 75%),
    radial-gradient(60% 35% at 100% 84%, rgba(3, 64, 96, .85), transparent 75%),
    radial-gradient(75% 42% at 62% 24%, rgba(22, 118, 150, .7), transparent 75%),
    radial-gradient(50% 30% at 0% 12%, rgba(12, 70, 100, .6), transparent 75%),
    linear-gradient(180deg, #03305a 0%, #01264a 38%, #04203f 55%, #0a1f38 66%, #0b2c3a 80%, #0c3d3e 100%);
}
body[data-tab="mehr"] .bg {
  background:
    radial-gradient(42% 22% at 0% 90%, rgba(14, 72, 58, .95), transparent 75%),
    linear-gradient(162deg, transparent 38%, rgba(120, 205, 225, .13) 48%, transparent 58%),
    linear-gradient(180deg, transparent 55%, rgba(1, 18, 38, .35) 100%),
    linear-gradient(90deg, #00142c 0%, #001a36 20%, #012244 33%, #043a68 52%, #065483 68%, #08668a 84%, #0a6a87 100%);
}
body[data-tab="ordner"] .bg {
  background:
    radial-gradient(55% 26% at 2% 84%, rgba(88, 165, 92, .95), transparent 75%),
    radial-gradient(36% 18% at 34% 90%, rgba(30, 140, 108, .8), transparent 75%),
    radial-gradient(62% 26% at 100% 0%, rgba(40, 150, 128, 1), rgba(30, 120, 115, .6) 45%, transparent 85%),
    radial-gradient(40% 22% at 60% 0%, rgba(20, 95, 110, .7), transparent 80%),
    radial-gradient(55% 30% at 100% 88%, rgba(3, 60, 93, .9), transparent 75%),
    linear-gradient(180deg, #00142f 0%, #021a3c 30%, #071b3a 55%, #0b1c34 70%, #0c2a36 100%);
}
html[data-theme="light"] .bg,
html[data-theme="light"] body[data-tab] .bg {
  background:
    radial-gradient(120% 60% at 90% -5%, rgba(255, 255, 255, .8), transparent 60%),
    radial-gradient(130% 70% at 50% 115%, rgba(110, 220, 90, .55), transparent 60%),
    linear-gradient(165deg, #2aa7ee 0%, #79d1f7 38%, #c6f1fb 68%, #bff0b4 100%);
}
@media (prefers-color-scheme: light) {
  html:not([data-theme="dark"]) .bg,
  html:not([data-theme="dark"]) body[data-tab] .bg {
    background:
      radial-gradient(120% 60% at 90% -5%, rgba(255, 255, 255, .8), transparent 60%),
      radial-gradient(130% 70% at 50% 115%, rgba(110, 220, 90, .55), transparent 60%),
      linear-gradient(165deg, #2aa7ee 0%, #79d1f7 38%, #c6f1fb 68%, #bff0b4 100%);
  }
}

/* Aurora-Halo hinter dem Spross (Start) */
.halo {
  position: absolute;
  left: calc(50% - 351.5px);
  top: -14px;
  width: 600px; height: 600px;
  border-radius: 50%;
  opacity: 0;
  mix-blend-mode: screen;
  -webkit-mask: radial-gradient(75% 55% at 72% 18%, #000 35%, rgba(0, 0, 0, .5) 60%, transparent 85%);
  mask: radial-gradient(75% 55% at 72% 18%, #000 35%, rgba(0, 0, 0, .5) 60%, transparent 85%);
  background:
    radial-gradient(circle closest-side, transparent 52%, rgba(60, 200, 210, .14) 55%, rgba(150, 255, 230, .4) 57.5%, rgba(225, 255, 255, .6) 58.5%, rgba(110, 220, 255, .32) 60.5%, transparent 65%),
    radial-gradient(circle closest-side, transparent 72%, rgba(70, 210, 200, .22) 76%, rgba(160, 255, 225, .68) 80.5%, rgba(248, 255, 255, .98) 82.5%, rgba(120, 225, 255, .62) 85%, rgba(60, 170, 230, .32) 89%, rgba(160, 120, 255, .18) 93%, transparent 98%),
    radial-gradient(circle closest-side, transparent 55%, rgba(40, 180, 200, .26) 75%, transparent 92%);
  filter: blur(7px);
  transition: opacity .4s;
}
.halo::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle closest-side, transparent 45%, rgba(120, 230, 255, .22) 66%, transparent 82%);
  filter: blur(16px);
}
.flare {
  position: absolute;
  left: calc(50% - 30px);
  top: 0;
  width: 260px; height: 190px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(200, 255, 255, .5), rgba(110, 220, 240, .22) 45%, transparent 100%);
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity .4s;
}
body[data-tab="start"] .halo, body[data-tab="start"] .flare { opacity: var(--aurora-opacity); }
/* schwache Bögen im Ordner-Tab */
.arc {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
  mix-blend-mode: screen;
  transition: opacity .4s;
}
.arc.a1 {
  left: calc(50% + 40px); top: 380px;
  width: 700px; height: 700px;
  background: radial-gradient(circle closest-side, transparent 88%, rgba(110, 220, 255, .22) 92%, rgba(170, 255, 220, .3) 94%, transparent 98%);
}
.arc.a2 {
  left: calc(50% - 287.5px); top: 400px;
  width: 1000px; height: 1000px;
  filter: blur(5px);
  background: radial-gradient(circle closest-side, transparent 84%, rgba(120, 230, 140, .2) 87%, rgba(170, 255, 170, .45) 89%, rgba(120, 220, 200, .25) 91%, transparent 95%);
  -webkit-mask: linear-gradient(90deg, #000 20%, transparent 45%);
  mask: linear-gradient(90deg, #000 20%, transparent 45%);
}
body[data-tab="ordner"] .arc { opacity: var(--aurora-opacity); }

/* Funkeln (4-zackige Sterne) */
.spark {
  position: absolute;
  left: var(--x); top: var(--y);
  width: var(--s); height: var(--s);
  background:
    radial-gradient(circle, #fff 0 14%, transparent 15%),
    linear-gradient(90deg, transparent 45%, rgba(255, 255, 255, .95) 50%, transparent 55%),
    linear-gradient(0deg, transparent 45%, rgba(255, 255, 255, .95) 50%, transparent 55%);
  -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%);
  mask: radial-gradient(circle, #000 18%, transparent 68%);
  filter: drop-shadow(0 0 4px rgba(220, 255, 255, .9));
  opacity: .2;
  animation: twinkle var(--d) ease-in-out infinite;
  animation-delay: var(--delay);
}
@keyframes twinkle {
  0%, 100% { opacity: .15; transform: scale(.55) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.1) rotate(20deg); }
}
/* Glitzer-Partikel (kleine leuchtende Striche) */
.speck {
  position: absolute;
  left: var(--x); top: var(--y);
  width: var(--w); height: var(--h);
  border-radius: 2px;
  background: linear-gradient(180deg, rgba(220, 255, 255, .95), rgba(110, 220, 255, .35));
  box-shadow: 0 0 4px rgba(150, 240, 255, .8);
  transform: rotate(var(--r));
  opacity: var(--o);
  animation: drift 7s ease-in-out infinite alternate;
  animation-delay: var(--delay);
}
@keyframes drift { from { translate: 0 0; } to { translate: 3px 6px; } }
.dot {
  position: absolute;
  left: var(--x); top: var(--y);
  width: var(--s); height: var(--s);
  border-radius: 50%;
  background: rgba(150, 245, 255, .85);
  box-shadow: 0 0 5px rgba(120, 235, 255, .9);
  opacity: var(--o);
}
/* Wassertropfen (Glas mit Lichtbrechung) */
.drop {
  position: absolute;
  left: var(--x); bottom: var(--b);
  width: var(--s); height: calc(var(--s) * var(--k, 1));
  border-radius: 50%;
  background:
    radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .95) 0 10%, rgba(255, 255, 255, 0) 24%),
    radial-gradient(circle at 60% 70%, rgba(255, 255, 255, .35), rgba(255, 255, 255, 0) 40%),
    radial-gradient(circle, rgba(190, 240, 255, .12) 50%, rgba(0, 30, 50, .5) 78%, rgba(235, 252, 255, .9) 96%);
  box-shadow: 0 2px 5px rgba(0, 20, 40, .45), 0 0 0 .5px rgba(255, 255, 255, .5);
  transform: rotate(var(--r, 0deg));
  opacity: 0;
  transition: opacity .4s;
}
body[data-tab="start"].start-empty .drop.on-start,
body[data-tab="mehr"] .drop.on-mehr { opacity: .95; }
.ordner-dots { position: absolute; inset: 0; opacity: 0; transition: opacity .4s; }
body[data-tab="ordner"] .ordner-dots { opacity: 1; }
/* Tropfen liegen auf der Tab-Leiste – eigene Ebene darüber */
.drops { position: fixed; inset: 0; z-index: 31; pointer-events: none; }

.app {
  max-width: 680px;
  margin: 0 auto;
  min-height: 100dvh;
  padding-bottom: calc(var(--tabbar-h) + var(--tabbar-bottom) + 112px);
}
.topbar { padding: calc(max(env(safe-area-inset-top), 47px) + 4px) 19px 8px; }
.topbar h1 {
  margin: 0;
  font-size: 44px;
  line-height: 48px;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--title);
  text-shadow: var(--title-shadow);
}
#view { padding: 0 18px 16px; }

/* Schwebende Glas-Tab-Leiste */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: var(--tabbar-bottom);
  z-index: 30;
  display: flex;
  justify-content: center;
  padding: 0 10px;
  pointer-events: none;
}
.tabbar-inner {
  position: relative;
  pointer-events: auto;
  display: flex;
  width: 100%;
  max-width: 560px;
  height: var(--tabbar-h);
  border-radius: 34px;
  border: 1.5px solid rgba(220, 250, 255, .7);
  background:
    radial-gradient(45% 4px at 52% 0, rgba(255, 255, 255, 1), transparent),
    linear-gradient(180deg, rgba(205, 248, 252, .55) 0%, rgba(120, 210, 220, .4) 40%, rgba(80, 180, 195, .36) 60%, rgba(105, 205, 215, .46) 100%);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .55), inset 0 -3px 10px rgba(255, 255, 255, .18), inset 0 0 0 1px rgba(255, 255, 255, .12), 0 10px 26px rgba(0, 15, 35, .45);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
}
.tabbar-inner::before {
  /* Lichtreflex oben auf dem Glas */
  content: '';
  position: absolute;
  left: 8%; right: 8%; top: 3px;
  height: 38%;
  border-radius: 30px 30px 50% 50% / 30px 30px 14px 14px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .46), rgba(255, 255, 255, .04));
  pointer-events: none;
}
.tab-btn {
  position: relative;
  flex: 1;
  border: 0;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 14px;
  gap: 2px;
  font-size: 15px;
  font-weight: 700;
  color: var(--tab-text);
  text-shadow: var(--tab-text-shadow);
}
.tab-btn .ico { width: 50px; height: 50px; margin-top: -4px; filter: drop-shadow(0 2px 2px rgba(0, 25, 45, .35)); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.tab-btn .ico svg { width: 100%; height: 100%; }
.tab-btn.active { color: var(--tab-active); }
.tab-btn.active .ico { transform: scale(1.04); }

/* Glänzende „+“-Kugel */
.fab {
  position: fixed;
  right: max(15px, calc((100vw - 680px) / 2 + 15px));
  bottom: calc(var(--tabbar-bottom) + var(--tabbar-h) + 18px);
  z-index: 25;
  width: 72px; height: 72px;
  padding: 0;
  border-radius: 50%;
  border: 2px solid rgba(225, 235, 255, .85);
  background:
    radial-gradient(70% 45% at 50% 18%, rgba(255, 255, 255, .85) 0%, rgba(255, 255, 255, .25) 60%, rgba(255, 255, 255, 0) 100%),
    radial-gradient(circle at 50% 80%, #8fb2ff 0%, #5a6ef0 45%, #3b3fcf 80%, #2d2aa8 100%);
  box-shadow: 0 0 0 3px rgba(120, 150, 255, .25), 0 0 22px rgba(110, 140, 255, .55), 0 10px 22px rgba(10, 20, 90, .55), inset 0 -8px 14px rgba(20, 10, 120, .45), inset 0 2px 2px rgba(255, 255, 255, .6);
  transition: transform .15s;
}
.fab svg { width: 38px; height: 38px; margin: 0 auto; filter: drop-shadow(0 2px 2px rgba(20, 20, 110, .6)); }
.fab[hidden] { display: none; }
.fab:active { transform: scale(.92); }

/* ==========================================================================
   3. Glas, Knöpfe, Felder
   ========================================================================== */
.card, .panel, .search .input {
  background:
    radial-gradient(42% 3px at 50% 0, rgba(255, 255, 255, 1), transparent),
    radial-gradient(60% 40% at 50% 0, rgba(255, 255, 255, .14), transparent),
    linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .06) 40%, transparent 50%),
    linear-gradient(180deg, var(--glass-hi) 0%, var(--glass-tint) 45%, var(--glass-tint) 100%);
  border: 1.5px solid var(--glass-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 0 14px rgba(255, 255, 255, .08), var(--glass-shadow);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  backdrop-filter: blur(12px) saturate(140%);
}
.muted { color: var(--text-dim); }
.small { font-size: 13px; }
.grow { flex: 1; }
.sec-title {
  font-size: 13px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-dim);
  margin: 8px 4px 12px;
}
.sec-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin: 28px 0 12px;
  padding: 4px;
  border: 0;
  background: none;
  font-size: 13px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-dim);
  text-align: left;
}
.sec-toggle .chev { margin-left: auto; }
.sec-toggle.open .chev { transform: rotate(90deg); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1.5px solid var(--glass-border);
  color: var(--btn-text);
  text-shadow: var(--text-shadow);
  font-weight: 650;
  font-size: 15px;
  white-space: nowrap;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .42) 0%, rgba(255, 255, 255, .14) 48%, rgba(255, 255, 255, .03) 52%, rgba(255, 255, 255, .12) 100%),
    var(--field-bg);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 10px rgba(0, 30, 50, .18);
  transition: transform .12s, filter .12s;
}
.btn svg { width: 1.4em; height: 1.4em; flex: none; }
.btn.primary, .btn.blue, .btn.danger-fill {
  color: #fff;
  border-color: rgba(240, 225, 255, .75);
}
.btn.primary {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .72) 0%, rgba(255, 255, 255, .26) 44%, rgba(255, 255, 255, 0) 50%),
    linear-gradient(180deg, #dcb4ff 0%, #b072fb 46%, #8c45ef 70%, #a666f7 90%, #c89aff 100%);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, .95), inset 0 -4px 9px rgba(255, 220, 255, .35), 0 0 0 1px rgba(110, 50, 190, .4), 0 0 22px rgba(190, 120, 255, .6), 0 6px 14px rgba(40, 0, 90, .45);
  text-shadow: 0 1px 2px rgba(60, 0, 120, .65);
}
.btn.blue {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .6) 0%, rgba(255, 255, 255, .18) 46%, rgba(255, 255, 255, 0) 50%),
    linear-gradient(180deg, #6fc4ff 0%, #2d8df0 50%, #1767d0 80%, #2a80e6 100%);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, .9), inset 0 -5px 10px rgba(0, 40, 120, .3), 0 0 0 1px rgba(10, 70, 160, .35), 0 0 14px rgba(60, 150, 255, .45), 0 5px 12px rgba(0, 30, 80, .4);
  text-shadow: 0 1px 2px rgba(0, 50, 120, .6);
}
.btn.danger-fill {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, .14) 48%, rgba(255, 255, 255, 0) 52%),
    linear-gradient(180deg, #ff8591 0%, #e73b4d 52%, #c21d33 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), inset 0 -4px 10px rgba(120, 0, 20, .3), 0 6px 18px rgba(230, 50, 70, .45);
  text-shadow: 0 1px 1px rgba(110, 0, 20, .5);
}
.btn.danger { color: var(--danger-text); }
.btn.small { padding: 6px 13px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:active:not(:disabled) { transform: scale(.96); filter: brightness(1.1); }

.input {
  width: 100%;
  padding: 11px 13px;
  border-radius: 13px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  color: var(--field-text);
  box-shadow: inset 0 2px 5px rgba(0, 20, 40, .12);
  font: inherit;
  font-size: 16px; /* < 16px würde auf iOS hineinzoomen */
  text-shadow: none;
}
.input::placeholder { color: var(--placeholder); }
.input:focus { outline: none; border-color: rgba(140, 230, 255, .95); box-shadow: inset 0 2px 5px rgba(0, 20, 40, .12), 0 0 0 3px rgba(110, 215, 255, .35); }
select.input {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--field-text) 50%), linear-gradient(135deg, var(--field-text) 50%, transparent 50%);
  background-position: calc(100% - 19px) 52%, calc(100% - 14px) 52%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
select.input option { color: #0b2f45; background: #fff; }
textarea.input { resize: none; line-height: 1.45; }
input[type="date"].input { min-height: 46px; }
.field { display: block; margin-top: 13px; }
.field > span {
  display: block;
  font-size: 12px;
  font-weight: 750;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 6px;
}

.chip { display: inline-flex; align-items: center; gap: 6px; }
.chip .dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .8), transparent 45%), var(--c);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .6), 0 0 6px var(--c);
  flex: none;
}

/* Leerer Start-Screen – Maße wie im Mockup */
.empty-state { position: relative; text-align: center; padding-top: 104px; }
.empty-state .sprout {
  position: relative;
  width: 180px; height: 150px;
  margin: 0 auto;
  translate: -4px 0;
  filter: drop-shadow(0 0 18px rgba(150, 255, 170, .35)) drop-shadow(0 6px 6px rgba(0, 30, 20, .35));
  animation: floaty 6s ease-in-out infinite;
}
.empty-state p { position: relative; margin: 26px 0 0; font-size: 23px; line-height: 26px; font-weight: 400; letter-spacing: -.01em; color: var(--text); }
.empty-state .btn { position: relative; margin-top: 19px; width: 291px; max-width: 100%; height: 61px; font-size: 21px; font-weight: 700; gap: 10px; }
.empty-state .btn svg { width: 34px; height: 34px; }
.empty-state .specks { position: absolute; inset: 0; pointer-events: none; }
.empty-small { color: var(--text-dim); text-align: center; padding: 20px 0; margin: 0; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* ==========================================================================
   4. Karten (überall gleich)
   ========================================================================== */
.list { display: flex; flex-direction: column; gap: 11px; }
.card {
  position: relative;
  color: var(--text);
  text-shadow: var(--text-shadow);
  border-radius: var(--radius);
  scroll-margin-top: 30px;
  scroll-margin-bottom: calc(var(--tabbar-h) + 120px);
}
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.card-main { flex: 1; min-width: 0; }
.card-title { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.card-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 3px; font-size: 13px; color: var(--text-dim); }
.chev { color: var(--text-dim); font-size: 24px; line-height: 1; transition: transform .2s; }
.card.open > .card-head .chev { transform: rotate(90deg); }
.handle {
  touch-action: none;
  cursor: grab;
  color: var(--text-dim);
  padding: 8px 6px;
  margin: -8px -2px -8px -6px;
  font-size: 18px;
  line-height: 1;
  letter-spacing: -3px;
}
.card.dragging { z-index: 5; cursor: grabbing; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 18px 40px rgba(0, 20, 40, .45); }
.list.drag-active .card:not(.dragging) { transition: transform .18s ease; }
.card-body { padding: 2px 16px 16px; border-top: 1px solid var(--inset-border); animation: bodyIn .24s ease; }
@keyframes bodyIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.status-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; }
.status-row .more { margin-left: auto; padding: 8px 14px; }
.sec { margin-top: 22px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 750; margin-bottom: 8px; }
.notes-view, .log-entry {
  background: var(--inset-bg);
  border: 1px solid var(--inset-border);
  box-shadow: inset 0 2px 6px rgba(0, 20, 40, .12);
  border-radius: 13px;
}
.notes-view { white-space: pre-wrap; overflow-wrap: anywhere; padding: 11px 13px; min-height: 48px; cursor: text; }
.notes-view.empty { color: var(--text-dim); }
textarea.notes-edit { min-height: 92px; display: block; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.log-entry { padding: 9px 13px; cursor: pointer; }
.log-date { font-size: 12px; font-weight: 750; color: var(--text-dim); }
.log-text { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Karten im Ordner: helles „Papier“ wie Blätter in einer Mappe */
.folder-inner .card {
  --text: #0b2f45;
  --text-dim: rgba(11, 47, 69, .66);
  --text-shadow: none;
  --link: #0a6ed1;
  --btn-text: #0b3550;
  --danger-text: #c0182b;
  --glass-border: rgba(0, 80, 120, .2);
  --field-bg: rgba(255, 255, 255, .78);
  --field-border: rgba(0, 80, 120, .2);
  --field-text: #0b2f45;
  --placeholder: rgba(11, 47, 69, .45);
  --inset-bg: rgba(0, 80, 120, .06);
  --inset-border: rgba(0, 80, 120, .11);
  background:
    radial-gradient(50% 3px at 50% 0, #fff, transparent),
    linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .5) 40%, transparent 50%),
    linear-gradient(180deg, rgba(255, 255, 255, .97), rgba(230, 245, 252, .92));
  border: 1px solid rgba(255, 255, 255, .95);
  box-shadow: inset 0 -2px 6px rgba(0, 60, 100, .08), 0 3px 10px rgba(0, 30, 50, .22);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}

/* ==========================================================================
   5. Hängeregister (Ordner-Tab) – Maße wie im Mockup
   ========================================================================== */
.search { position: relative; margin: 23px 0 28px; }
.search .input {
  height: 47px;
  padding-left: 62px;
  --glass-hi: rgba(235, 250, 255, .5);
  --glass-tint: rgba(205, 235, 248, .3);
  padding-right: 42px;
  border-radius: 999px;
  font-size: 17px;
  color: var(--text);
  text-shadow: var(--text-shadow);
}
.search .input::placeholder { color: var(--placeholder); text-shadow: var(--text-shadow); }
.search .input:focus { border-color: rgba(160, 235, 255, .95); }
.search .ico {
  position: absolute;
  z-index: 2; /* das Glasfeld bildet eine eigene Ebene – Lupe muss darüber liegen */
  left: -6px; top: -14px;
  width: 70px; height: 70px;
  filter: drop-shadow(0 3px 3px rgba(0, 20, 50, .5));
  pointer-events: none;
}
.search .ico svg { width: 100%; height: 100%; }
.search .clear {
  position: absolute;
  z-index: 2;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: none;
  color: var(--text-dim);
  font-size: 18px;
  padding: 6px 10px;
}
.search input::-webkit-search-cancel-button { display: none; }

.cabinet { padding: 0 0 8px; margin: 0 -1px; }
.folder {
  --fc: #8fa6b8;
  --fc-fg: #fff;
  --fc-ts: 0 1px 2px rgba(0, 0, 0, .4);
  --fc-hi: color-mix(in srgb, var(--fc) 62%, white);
  --fc-lo: color-mix(in srgb, var(--fc) 82%, black);
  position: relative;
  scroll-margin-top: 20px;
}
.folder + .folder { margin-top: -45px; transition: margin-top .38s cubic-bezier(.2, .8, .2, 1); }
/* nach einem geöffneten Ordner nicht überlappen – sonst verdeckt der nächste Reiter die letzte Karte */
.folder.open + .folder { margin-top: 12px; }
.folder-tab {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: stretch;
  width: max-content;
  max-width: calc(100% - var(--off) - 24px);
  height: 36px;
  margin-left: var(--off);
  color: var(--fc-fg);
  text-shadow: var(--fc-ts);
  border-radius: 9px 9px 0 0;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, .15) 55%, rgba(255, 255, 255, 0) 60%),
    linear-gradient(180deg, var(--fc-hi), var(--fc) 70%);
  box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .85), inset 1px 0 0 rgba(255, 255, 255, .35);
}
/* schräge Reiter-Flanken wie bei echten Mappen */
.folder-tab::before, .folder-tab::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 22px;
  background: inherit;
  box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .85);
  z-index: -1;
}
.folder-tab::after { right: -16px; border-top-right-radius: 9px; transform: skewX(32deg); transform-origin: bottom left; }
.folder-tab::before { left: -16px; border-top-left-radius: 9px; transform: skewX(-32deg); transform-origin: bottom right; }
.folder.off0 .folder-tab::before { display: none; }
.folder-tab-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  padding: 0 4px 0 13px;
  border: 0;
  background: none;
  color: inherit;
  font-weight: 700;
  font-size: 19px;
  letter-spacing: -.01em;
}
.folder:not(.off0) .folder-tab-btn { padding-left: 4px; }
.folder-tab-btn .emo { font-size: 19px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .25)); text-shadow: none; }
.folder-tab-btn .emo svg { width: 28px; height: 28px; }
.folder-tab-btn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-tab .count {
  min-width: 24px;
  height: 19px;
  line-height: 19px;
  padding: 0 7px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  color: #fff;
  text-shadow: none;
  background: rgba(0, 25, 40, .42);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .45), 0 1px 0 rgba(255, 255, 255, .45);
}
.folder-more { border: 0; background: none; color: inherit; font-weight: 800; font-size: 20px; padding: 0 6px 0 2px; }
.folder:not(.open) .folder-more { display: none; }
.folder-front {
  position: relative;
  min-height: 72px;
  padding: 0 8px;
  border-radius: 0 14px 14px 14px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .6) 0, rgba(255, 255, 255, .14) 3px, rgba(255, 255, 255, 0) 30px),
    linear-gradient(180deg, color-mix(in srgb, var(--fc) 82%, #fff6a0) 0%, var(--fc) 40%, color-mix(in srgb, var(--fc) 82%, black) 100%);
  box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .75), inset 0 -3px 8px rgba(0, 0, 0, .12), 0 -3px 10px rgba(0, 20, 40, .22), 0 8px 18px rgba(0, 20, 40, .3);
  transition: min-height .38s cubic-bezier(.2, .8, .2, 1);
}
.folder:not(.off0) .folder-front { border-top-left-radius: 14px; }
/* Funkeln an der Mappenecke */
.folder-front > .spark { --s: 18px; left: auto; right: -6px; top: -7px; animation-duration: 3.6s; }
/* Der vorderste Ordner zeigt seine ganze Vorderseite – wie im Mockup */
.folder.last:not(.open) .folder-front {
  min-height: 92px;
  background:
    radial-gradient(140% 85% at 10% -25%, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, .22) 62%, rgba(255, 255, 255, 0) 63%),
    linear-gradient(180deg, rgba(255, 255, 255, .7) 0, rgba(255, 255, 255, .15) 4px, rgba(255, 255, 255, 0) 22px),
    linear-gradient(180deg, color-mix(in srgb, var(--fc) 80%, white) 0%, var(--fc) 40%, color-mix(in srgb, var(--fc) 72%, #0a1a2a) 100%);
}
.folder-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .38s cubic-bezier(.2, .8, .2, 1); }
.folder.open .folder-wrap { grid-template-rows: 1fr; }
.folder.open .folder-front { min-height: 0; }
.folder-content { overflow: hidden; min-height: 0; }
.folder-inner { display: flex; flex-direction: column; gap: 9px; padding: 8px 0 10px; }
.folder:not(.open) .folder-inner { visibility: hidden; transition: visibility 0s .38s; }
.folder-new {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 177px;
  height: 48px;
  margin: 15px 0 0 1px;
  padding: 0;
  border: 2px dashed rgba(200, 225, 240, .55);
  border-radius: 12px;
  background: rgba(255, 255, 255, .04);
  color: rgba(230, 245, 255, .9);
  text-shadow: var(--text-shadow);
  font-weight: 600;
  font-size: 17px;
}

/* ==========================================================================
   6. Mehr-Tab – Maße wie im Mockup
   ========================================================================== */
.panel {
  position: relative;
  border-radius: var(--radius);
  padding: 14px 15px 15px;
  margin-bottom: 11px;
}
.panel:first-child { margin-top: 7px; }
.panel h2 { font-size: 19px; line-height: 24px; font-weight: 700; margin: 0 0 6px; }
.panel p { margin: 0 0 12px; }
.panel .desc { font-size: 15px; line-height: 21px; margin: 0 0 9px; }
.panel-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  border: 0;
  background: none;
  padding: 0;
  font-weight: 700;
  font-size: 19px;
  text-align: left;
}
.panel-toggle svg { width: 46px; height: 46px; flex: none; margin: -9px -2px -9px -4px; filter: drop-shadow(0 2px 2px rgba(0, 20, 40, .4)); }
.panel-toggle .chev { margin-left: auto; color: #fff; font-size: 26px; }
.panel-toggle.open .chev { transform: rotate(90deg); }
.panel.p-verw { padding: 9px 15px; min-height: 59px; display: flex; flex-direction: column; justify-content: center; }
.acct { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.acct img { width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .8); box-shadow: 0 3px 8px rgba(0, 0, 0, .25); }
.acct-local { margin: 0 0 12px; font-size: 15px; line-height: 20.5px; }
.acct-local::after { content: ''; display: table; clear: both; }
.acct-local .phone-ic { float: left; width: 27px; height: 46px; margin: 0 9px 0 2px; filter: drop-shadow(0 2px 2px rgba(0, 20, 40, .45)); }
.acct-local .phone-ic svg { width: 100%; height: 100%; }
.acct-local p { margin: 0; }
.panel .btn.primary.google { height: 50px; padding: 0 27px; font-size: 19px; font-weight: 700; }
.panel .btn.blue { height: 42px; width: calc(50% - 6px); padding: 0 8px; font-size: 16px; font-weight: 700; }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 11px 0; border-top: 1px solid var(--inset-border); }
.row:first-child { border-top: 0; }
.row-main { flex: 1 1 180px; min-width: 0; }
.row-title { font-weight: 650; overflow-wrap: anywhere; }
.btn-row { display: flex; flex-wrap: wrap; gap: 11px; }
.seg {
  display: flex;
  height: 49px;
  padding: 4px;
  margin: 12px 3px 0 0;
  border-radius: 25px;
  background: rgba(150, 190, 205, .18);

}
.seg button {
  flex: 1;
  border: 1px solid transparent;
  background: none;
  padding: 0 6px;
  border-radius: 21px;
  font-weight: 500;
  font-size: 16px;

}
.seg button.on {
  color: #fff;
  font-weight: 600;
  border-color: rgba(255, 255, 255, .7);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, .2) 50%, rgba(255, 255, 255, .1) 52%, rgba(255, 255, 255, .25) 100%),
    rgba(170, 210, 225, .35);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), 0 2px 8px rgba(0, 30, 60, .3);
}
.about { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 0; color: var(--text-dim); font-size: 13px; }
.about img { width: 34px; height: 34px; filter: drop-shadow(0 3px 6px rgba(0, 30, 60, .35)); }

/* ==========================================================================
   7. Sheets, Dialoge, Hinweise
   ========================================================================== */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(0, 15, 30, 0);
  transition: background .2s;
}
.sheet-backdrop.show { background: rgba(0, 15, 30, .45); }
.sheet {
  width: 100%;
  max-width: 560px;
  max-height: 92dvh;
  overflow: auto;
  color: var(--text);
  text-shadow: var(--text-shadow);
  background: var(--sheet-bg);
  border: 1px solid rgba(255, 255, 255, .45);
  border-bottom: 0;
  border-radius: 26px 26px 0 0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 -12px 40px rgba(0, 20, 40, .45);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  backdrop-filter: blur(24px) saturate(160%);
  padding: 8px 18px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform .26s cubic-bezier(.2, .8, .2, 1);
}
.sheet-backdrop.show .sheet { transform: none; }
.sheet-grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .55); margin: 0 auto 10px; }
.sheet-title { margin: 4px 0 6px; font-size: 21px; font-weight: 750; }
.sheet-text { margin: 6px 0 4px; color: var(--text-dim); }
.sheet-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
.sheet-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.sheet-list .btn { justify-content: flex-start; border-radius: 16px; padding: 14px 18px; font-size: 16px; }
@media (min-width: 700px) {
  .sheet-backdrop { align-items: center; }
  .sheet { border-radius: 26px; border-bottom: 1px solid rgba(255, 255, 255, .45); padding-bottom: 20px; transform: translateY(24px); opacity: 0; transition: transform .2s, opacity .2s; }
  .sheet-backdrop.show .sheet { opacity: 1; }
  .sheet-grab { display: none; }
}
.big-input { font-size: 18px; padding: 14px 15px; }
.swatches { display: flex; flex-wrap: wrap; gap: 11px; }
.swatch {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .75);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .6), rgba(255, 255, 255, .12) 48%, rgba(255, 255, 255, 0) 52%),
    var(--c);
  box-shadow: inset 0 -3px 6px rgba(0, 0, 0, .18), 0 2px 6px rgba(0, 0, 0, .25);
}
.swatch.on { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 14px var(--c), 0 2px 6px rgba(0, 0, 0, .25); }
.emoji-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.emoji-row button {
  width: 40px; height: 40px;
  padding: 0;
  border-radius: 12px;
  border: 1px solid var(--field-border);
  background: linear-gradient(180deg, rgba(255, 255, 255, .3), rgba(255, 255, 255, .06) 52%), var(--field-bg);
  font-size: 20px;
}
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; font-weight: 650; cursor: pointer; }
.switch-row input { position: absolute; opacity: 0; pointer-events: none; }
.switch {
  position: relative;
  flex: none;
  width: 54px; height: 32px;
  border-radius: 999px;
  background: var(--inset-bg);
  border: 1px solid var(--field-border);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, .25);
  transition: background .2s;
}
.switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 25%, #fff 0 35%, #dfe9f0 100%);
  box-shadow: 0 2px 5px rgba(0, 0, 0, .35), inset 0 -2px 3px rgba(0, 0, 0, .08);
  transition: transform .22s cubic-bezier(.3, 1.4, .5, 1);
}
.switch-row input:checked + .switch {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, .1) 50%, rgba(255, 255, 255, 0) 54%),
    linear-gradient(180deg, #c487ff, #7c35e8);
  border-color: rgba(255, 255, 255, .6);
}
.switch-row input:checked + .switch::after { transform: translateX(22px); }
.switch-row input:focus-visible + .switch { outline: 2px solid #a8ecff; outline-offset: 2px; }

#toasts {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--tabbar-bottom) + var(--tabbar-h) + 102px); /* über dem „+“-Knopf */
  z-index: 60;
  display: flex;
  justify-content: center;
  padding: 0 14px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 560px;
  width: max-content;
  padding: 12px 10px 12px 18px;
  border-radius: 18px;

/* ==========================================================================
   2. Hinweise (Toasts), Sheets, Dialoge
   ========================================================================== */
let toastTimer = null;
function toast(msg, type = 'info', { duration = 3000, action } = {}) {
  const root = $('#toasts');
  clearTimeout(toastTimer);
  root.innerHTML = '';
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('button').addEventListener('click', () => { t.remove(); action.fn(); });
  root.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), duration);
}
const undoToast = (msg, undo) => toast(msg, 'info', { duration: 5000, action: { label: 'Rückgängig', fn: undo } });

function openSheet({ title, body, onMount }) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title || '')}">
    <div class="sheet-grab"></div>${title ? `<h3 class="sheet-title">${esc(title)}</h3>` : ''}${body}</div>`;
  $('#modal-root').appendChild(wrap);
  const prevFocus = document.activeElement;
  let closed = false;
  const onKey = e => { if (e.key === 'Escape') close(); };
  function close() {
    if (closed) return;
    closed = true;
    wrap.classList.remove('show');
    wrap.style.pointerEvents = 'none'; // während des Ausblendens keine Klicks mehr abfangen
    document.removeEventListener('keydown', onKey);
    setTimeout(() => wrap.remove(), 230);
    if (prevFocus && prevFocus.focus && document.contains(prevFocus) && !prevFocus.closest('.card')) prevFocus.focus({ preventScroll: true });
    if (wrap._onClose) wrap._onClose();
  }
  wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  document.addEventListener('keydown', onKey);
  requestAnimationFrame(() => wrap.classList.add('show'));
  if (onMount) onMount($('.sheet', wrap), close, fn => { wrap._onClose = fn; });
  return close;
}

function confirmDialog({ title, text, okLabel = 'OK', cancelLabel = 'Abbrechen', danger = false }) {
  return new Promise(resolve => {
    let result = false;
    openSheet({
      title,
      body: `<p class="sheet-text">${esc(text)}</p>
        <div class="sheet-actions"><span class="grow"></span>
          <button class="btn" data-k="no">${esc(cancelLabel)}</button>
          <button class="btn ${danger ? 'danger-fill' : 'primary'}" data-k="yes">${esc(okLabel)}</button>
        </div>`,
      onMount(sheet, close, onClose) {
        onClose(() => resolve(result));
        sheet.querySelector('[data-k=no]').addEventListener('click', close);
        sheet.querySelector('[data-k=yes]').addEventListener('click', () => { result = true; close(); });
        sheet.querySelector('[data-k=yes]').focus();
      }
    });
  });
}

/** Auswahl-Liste von unten; liefert den key der Auswahl oder null */
function actionSheet(title, options) {
  return new Promise(resolve => {
    let result = null;
    openSheet({
      title,
      body: `<div class="sheet-list">${options.map(o =>
        `<button class="btn ${o.danger ? 'danger' : ''}" data-k="${esc(o.key)}" ${o.disabled ? 'disabled' : ''}>${esc(o.label)}</button>`).join('')}
        <button class="btn" data-k="">Abbrechen</button></div>`,
      onMount(sheet, close, onClose) {
        onClose(() => resolve(result));
        sheet.addEventListener('click', e => {
          const b = e.target.closest('[data-k]');
          if (!b) return;
          result = b.dataset.k || null;
          close();
        });
      }
    });
  });
}

/* ==========================================================================
   3. Store – In-Memory + localStorage + Firestore (Realtime)
   Writes landen sofort lokal; Firestore synchronisiert im Hintergrund
   (mit enablePersistence auch offline).
   ========================================================================== */
const Store = (() => {
  const data = { folders: {}, items: {}, meta: {} };
  const listeners = new Set();
  const syncListeners = new Set();
  let owner = 'local';        // 'local' (Gast) oder Firebase-UID
  let cloudInit = false;      // Erst-Abgleich mit dem Konto erledigt?
  let mergePending = false;   // Gast-Daten warten noch auf den Upload
  let queue = [];             // Ops, die gemacht wurden, während Firebase nicht verbunden war
  let uid = null, db = null;
  let unsubs = [];
  let serverSeen = {};
  let pendingWrites = 0;
  let pendingInit = false;
  let askMergeFn = null;
  let loud = false, flushTimer = null;

  /* ---------- lokal ---------- */
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS.data);
      if (!raw) return;
      const o = JSON.parse(raw);
      owner = o.owner || 'local';
      cloudInit = !!o.cloudInit;
      mergePending = !!o.mergePending;
      queue = Array.isArray(o.queue) ? o.queue : [];
      for (const c of COLLS) if (o.colls && o.colls[c]) data[c] = o.colls[c];
    } catch (e) { console.warn('Lokaler Speicher defekt – wird neu aufgebaut', e); }
  }
  let quotaWarned = false;
  const saveLocal = debounce(() => {
    try {
      localStorage.setItem(LS.data, JSON.stringify({ owner, cloudInit, mergePending, queue, savedAt: Date.now(), colls: data }));
    } catch (e) {
      console.error(e);
      if (!quotaWarned) { quotaWarned = true; toast('Lokaler Speicher voll – bitte ein Backup machen', 'error'); }
    }
  }, 300);

  /** loud = Ansicht neu zeichnen; leise Änderungen (Tippen in Notizen) nur speichern */
  function changed(isLoud) {
    if (isLoud) loud = true;
    if (!flushTimer) flushTimer = setTimeout(flush, 0);
  }
  function flush() {
    flushTimer = null;
    saveLocal();
    if (!loud) return;
    loud = false;
    listeners.forEach(cb => { try { cb(); } catch (e) { console.error(e); } });
  }

  /* ---------- Firestore-Helfer ---------- */
  const ref = c => db.collection('users').doc(uid).collection(c);
  function toRemote(doc) {
    const o = JSON.parse(JSON.stringify(doc)); // entfernt undefined (mag Firestore nicht)
    delete o.id;
    return o;
  }
  const online = () => !!(uid && db);
  function track(p) {
    pendingWrites++;
    emitSync();
    p.catch(fsError).finally(() => { pendingWrites--; emitSync(); });
  }
  function emitSync() { const s = syncState(); syncListeners.forEach(cb => cb(s)); }
  function syncState() {
    if (!uid) return owner !== 'local' ? 'offline' : 'local';
    if (!navigator.onLine) return 'offline';
    return pendingWrites > 0 ? 'pending' : 'synced';
  }
  function enqueue(op) {
    // Cache gehört einem Konto, Firebase ist aber (noch) nicht verbunden → später nachholen
    if (owner !== 'local' && !uid) queue.push(op);
  }

  /* ---------- öffentliche API ---------- */
  function put(coll, id, doc, opts = {}) {
    const prev = data[coll][id];
    const next = opts.replace || !prev ? { ...doc, id } : { ...prev, ...doc, id };
    data[coll][id] = next;
    changed(!opts.silent);
    if (online()) { try { track(ref(coll).doc(id).set(toRemote(next), { merge: !opts.replace })); } catch (e) { fsError(e); } }
    else enqueue({ t: 'put', c: coll, id });
    return next;
  }
  function del(coll, id) {
    delete data[coll][id];
    changed(true);
    if (online()) { try { track(ref(coll).doc(id).delete()); } catch (e) { fsError(e); } }
    else enqueue({ t: 'del', c: coll, id });
  }
  /** Mehrere Writes – lokal sofort, remote in Firestore-Batches */
  async function batch(ops) {
    for (const op of ops) {
      if (op.type === 'put') {
        const prev = data[op.coll][op.id];
        data[op.coll][op.id] = op.replace || !prev ? { ...op.doc, id: op.id } : { ...prev, ...op.doc, id: op.id };
      } else delete data[op.coll][op.id];
    }
    changed(true);
    if (!online()) { ops.forEach(op => enqueue({ t: op.type === 'put' ? 'put' : 'del', c: op.coll, id: op.id })); return; }
    await remoteBatch(ops.map(op => ({ type: op.type, coll: op.coll, id: op.id, replace: op.replace })));
  }
  /** Ops in Firestore-Batches (max. 450 je Batch). Liefert false, wenn etwas schiefging. */
  async function remoteBatch(ops, { wait = 5000 } = {}) {
    let ok = true;
    for (let i = 0; i < ops.length; i += 450) {
      const b = db.batch();
      for (const op of ops.slice(i, i + 450)) {
        const r = ref(op.coll).doc(op.id);
        const doc = data[op.coll][op.id];
        try {
          if (op.type === 'put') { if (doc) b.set(r, toRemote(doc), { merge: !op.replace }); }
          else b.delete(r);
        } catch (e) { console.error('[Firestore] übersprungen', op, e); ok = false; }
      }
      const p = b.commit();
      track(p);
      p.catch(() => { ok = false; });
      // Offline löst commit() erst nach dem Server-Ack auf → nicht ewig blockieren
      if (navigator.onLine) await Promise.race([p.catch(() => {}), sleep(wait)]);
    }
    return ok;
  }
  const all = coll => Object.values(data[coll]);
  const raw = (coll, id) => data[coll][id] || null;
  function subscribe(cb) { listeners.add(cb); return () => listeners.delete(cb); }
  function settings() { return { theme: 'auto', ...(data.meta.settings || {}) }; }
  function saveSettings(patch) {
    const next = { ...settings(), ...patch };
    delete next.id;
    return put('meta', 'settings', next);
  }
  function resetData() {
    data.folders = {};
    data.items = {};
    data.meta = data.meta.settings ? { settings: data.meta.settings } : {};
    queue = [];
    changed(true);
  }
  const hasUserData = () => Object.keys(data.items).length > 0 || Object.keys(data.folders).length > 0;

  /* ---------- Firebase verbinden / trennen ---------- */
  async function attach(userId, { askMerge } = {}) {
    detachListeners();
    askMergeFn = askMerge || null;
    const guest = owner === 'local' || (owner === userId && mergePending);
    if (owner !== 'local' && owner !== userId) { resetData(); cloudInit = false; mergePending = false; }
    if (owner === 'local') cloudInit = false;
    uid = userId;
    db = firebase.firestore();
    serverSeen = {};
    // Offline gesammelte Ops nachholen (nur wenn der Cache diesem Konto gehört)
    if (owner === userId && queue.length && cloudInit) {
      const ops = queue.map(q => ({ type: q.t === 'put' ? 'put' : 'del', coll: q.c, id: q.id }));
      queue = [];
      await remoteBatch(ops).catch(fsError);
    }
    if (!cloudInit) await initialSync(guest, askMerge);
    owner = userId;
    saveLocal();
    if (cloudInit) subscribeAll();
    emitSync();
  }
  function subscribeAll() {
    detachListeners();
    for (const c of COLLS) unsubs.push(ref(c).onSnapshot(snap => onSnap(c, snap), err => fsError(err)));
  }
  /** Erster Abgleich mit dem Konto. Lokale Daten werden erst ersetzt, wenn der Upload sicher geklappt hat. */
  async function initialSync(guest, askMerge) {
    try {
      await Promise.all(['items', 'folders'].map(c => ref(c).limit(1).get({ source: 'server' })));
    } catch (e) {
      console.warn('Server nicht erreichbar – Erst-Abgleich folgt, sobald online', e);
      if (e && e.code === 'permission-denied') fsError(e);
      pendingInit = true;
      mergePending = guest;
      return;
    }
    if (guest && hasUserData()) {
      if (askMerge && await askMerge()) {
        const ops = [];
        for (const c of ['folders', 'items']) for (const id of Object.keys(data[c])) ops.push({ type: 'put', coll: c, id });
        if (!await remoteBatch(ops, { wait: 20000 })) {
          pendingInit = true;
          mergePending = guest;
          toast('Hochladen ins Konto hat nicht geklappt – deine Daten bleiben auf diesem Gerät, neuer Versuch beim nächsten Start.', 'error', { duration: 6000 });
          return;
        }
      } else resetData();
    }
    pendingInit = false;
    mergePending = false;
    cloudInit = true;
  }
  function onSnap(c, snap) {
    // Leerer Cache-Snapshot beim allerersten Start würde lokale Daten kurz löschen → ignorieren
    if (snap.metadata.fromCache && snap.empty && !serverSeen[c] && Object.keys(data[c]).length) return;
    const firstServer = !snap.metadata.fromCache && !serverSeen[c];
    if (!snap.metadata.fromCache) serverSeen[c] = true;
    const next = {};
    snap.forEach(d => { next[d.id] = { ...d.data(), id: d.id }; });
    // Konto hat noch keine Einstellungen → die lokalen behalten und hochladen
    if (c === 'meta' && firstServer && !next.settings && data.meta.settings) {
      next.settings = data.meta.settings;
      setTimeout(() => put('meta', 'settings', data.meta.settings), 0);
    }
    const same = stable(next) === stable(data[c]);
    data[c] = next;
    changed(!same);
  }
  function detachListeners() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; }
  function detach() {
    detachListeners();
    uid = null; db = null; owner = 'local'; cloudInit = false; mergePending = false; pendingInit = false;
    resetData();
    saveLocal.now();
    emitSync();
  }
  async function retryInit() {
    if (!online() || !pendingInit) return;
    await initialSync(mergePending, askMergeFn);
    saveLocal();
    if (cloudInit) { subscribeAll(); emitSync(); }
  }
  function boot() {
    loadLocal();
    window.addEventListener('online', () => { emitSync(); retryInit(); });
    window.addEventListener('offline', emitSync);
  }

  return {
    boot, put, del, batch, all, raw, subscribe, settings, saveSettings,
    attach, detach, hasUserData, syncState, emitSync,
    saveNow: () => saveLocal.now(),
    onSync: cb => { syncListeners.add(cb); return () => syncListeners.delete(cb); },
    owner: () => owner
  };
})();

let lastFsErr = 0;
function fsError(e) {
  console.error('[Firestore]', e);
  if (Date.now() - lastFsErr < 4000) return;
  lastFsErr = Date.now();
  const msg = e && e.code === 'permission-denied'
    ? 'Keine Berechtigung – Firestore-Regeln prüfen (siehe README)'
    : (e && e.message) || String(e);
  toast('Sync-Fehler: ' + msg, 'error');
}

/* ==========================================================================
   4. Auth (Google-Login) & Firebase-Initialisierung
   ========================================================================== */
const Auth = (() => {
  let user = null;
  let enabled = false;
  let status = 'init'; // init | unconfigured | ready | failed
  const configured = () => {
    const k = String(FIREBASE_CONFIG.apiKey || '');
    return !!k && !k.startsWith('DEINE') && !String(FIREBASE_CONFIG.projectId || '').startsWith('DEIN');
  };
  const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  async function init() {
    if (!configured()) { status = 'unconfigured'; Store.emitSync(); return; }
    try {
      await loadScript(CDN.fbApp);
      await Promise.all([loadScript(CDN.fbAuth), loadScript(CDN.fbStore)]);
    } catch (e) {
      status = 'failed';
      Store.emitSync();
      toast('Firebase nicht erreichbar – lokaler Modus, Sync folgt beim nächsten Start', 'warn');
      return;
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      const db = firebase.firestore();
      try { await db.enablePersistence({ synchronizeTabs: true }); }
      catch (e) { console.warn('Offline-Persistence nicht verfügbar:', e.code || e); }
      enabled = true;
      status = 'ready';
      firebase.auth().getRedirectResult().catch(e => toast(authMsg(e), 'error'));
      firebase.auth().onAuthStateChanged(onUser);
    } catch (e) {
      status = 'failed';
      toast('Firebase-Fehler: ' + e.message, 'error');
    }
    Store.emitSync();
  }
  async function onUser(u) {
    if (u) {
      user = { uid: u.uid, name: u.displayName || '', email: u.email || '', photo: u.photoURL || '' };
      try { await Store.attach(u.uid, { askMerge }); } catch (e) { fsError(e); }
    } else {
      const had = !!user || Store.owner() !== 'local';
      user = null;
      if (had) Store.detach();
    }
    scheduleRender();
  }
  function askMerge() {
    const n = Store.all('items').length;
    const f = Store.all('folders').length;
    return confirmDialog({
      title: 'Lokale Daten übernehmen?',
      text: `Du hast ohne Konto ${n} ${n === 1 ? 'Eintrag' : 'Einträge'} und ${f} Ordner angelegt. Sollen sie in dein Google-Konto übernommen werden? Sonst werden sie auf diesem Gerät verworfen.`,
      okLabel: 'Übernehmen', cancelLabel: 'Verwerfen'
    });
  }
  async function signIn() {
    if (!configured()) { toast('Firebase ist noch nicht eingerichtet – siehe README', 'warn'); return; }
    if (!enabled) { toast('Firebase lädt noch oder ist offline', 'warn'); return; }
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
      await firebase.auth().signInWithPopup(provider);
    } catch (e) {
      const cancelled = ['auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/user-cancelled'].includes(e.code);
      const fallback = ['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/web-storage-unsupported', 'auth/internal-error'].includes(e.code);
      if (!cancelled && (fallback || isIOS())) {
        // iOS-Safari / Standalone-PWA: Popup scheitert oft → Redirect
        try { await firebase.auth().signInWithRedirect(provider); }
        catch (e2) { toast(authMsg(e2), 'error'); }
      } else if (!cancelled) toast(authMsg(e), 'error');
    }
  }
  async function signOut() {
    const ok = await confirmDialog({
      title: 'Abmelden?',
      text: 'Deine Daten bleiben im Konto. Die lokale Kopie auf diesem Gerät wird entfernt.',
      okLabel: 'Abmelden', danger: true
    });
    if (!ok) return;
    try { await firebase.auth().signOut(); toast('Abgemeldet'); }
    catch (e) { toast(authMsg(e), 'error'); }
  }
  function authMsg(e) {
    const map = {
      'auth/unauthorized-domain': 'Diese Domain ist in Firebase nicht autorisiert (Authentication → Settings → Authorized domains).',
      'auth/network-request-failed': 'Keine Verbindung – bitte später erneut versuchen.',
      'auth/popup-blocked': 'Popup wurde blockiert.',
      'auth/operation-not-allowed': 'Google-Login ist in Firebase nicht aktiviert.'
    };
    return 'Login-Fehler: ' + (map[e && e.code] || (e && e.message) || e);
  }
  return { init, signIn, signOut, configured, user: () => user, status: () => status };
})();

/* ==========================================================================
   5. Daten-Abfragen
   ========================================================================== */
const byNewest = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
const byChanged = (a, b) => (b.statusChangedAt || 0) - (a.statusChangedAt || 0);

const Data = {
  /** eigene Ordner in manueller Reihenfolge */
  folders: () => Store.all('folders').sort((a, b) => (a.order || 0) - (b.order || 0) || (a.createdAt || 0) - (b.createdAt || 0)),
  folder: id => FIXED[id] || Store.raw('folders', id),
  /** Ursprungsordner eines Dings – fällt auf Unsortiert zurück, wenn der Ordner fehlt */
  originId(it) {
    const f = it && it.folderId;
    return f && (f === UNSORTED || (f !== LEARNED && Store.raw('folders', f))) ? f : UNSORTED;
  },
  origin: it => Data.folder(Data.originId(it)),
  items: st => Store.all('items').filter(i => i.status === st),
  ideasIn: fid => Data.items('idea').filter(i => Data.originId(i) === fid).sort(byNewest),
  active: () => Data.items('active').sort((a, b) => (a.activeOrder || 0) - (b.activeOrder || 0) || (a.statusChangedAt || 0) - (b.statusChangedAt || 0)),
  paused: () => Data.items('paused').sort(byChanged),
  learned: () => Data.items('learned').sort(byChanged),
  discarded: () => Data.items('discarded').sort(byChanged),
  maxActiveOrder: () => Math.max(0, ...Data.items('active').map(i => i.activeOrder || 0))
};
const folderLabel = f => `${f.emoji ? f.emoji + ' ' : ''}${f.name}`;
const chipHTML = f => `<span class="chip" style="--c:${COLOR[f.color] || COLOR.grau}"><span class="dot"></span>${esc(folderLabel(f))}</span>`;

/* ==========================================================================
   6. Aktionen (Änderungen an Daten)
   ========================================================================== */
const Act = {
  create({ title, folderId, active }) {
    const now = Date.now();
    const id = rid('i_');
    Store.put('items', id, {
      title, folderId, status: active ? 'active' : 'idea', notes: '', log: [],
      activeOrder: active ? Data.maxActiveOrder() + 1 : 0,
      createdAt: now, updatedAt: now, statusChangedAt: now
    });
    return id;
  },
  /** Statuswechsel mit Rückgängig-Hinweis */
  setStatus(id, status, msg) {
    const it = Store.raw('items', id);
    if (!it) return;
    const prev = clone(it);
    const now = Date.now();
    const patch = { status, statusChangedAt: now, updatedAt: now };
    if (status === 'active') patch.activeOrder = Data.maxActiveOrder() + 1;
    Store.put('items', id, patch);
    undoToast(msg(it), () => Store.put('items', id, prev, { replace: true }));
  },
  activate: id => Act.setStatus(id, 'active', it => `🔥 „${it.title}“ ist jetzt auf Start`),
  pause: id => Act.setStatus(id, 'paused', it => `⏸️ „${it.title}“ pausiert`),
  resume: id => Act.setStatus(id, 'active', it => `🔥 Weiter geht's mit „${it.title}“`),
  learned: id => Act.setStatus(id, 'learned', it => `✅ „${it.title}“ gelernt – liegt jetzt in Gelernt`),
  relearn: id => Act.setStatus(id, 'active', it => `🔁 „${it.title}“ ist wieder auf Start`),
  toIdea: id => Act.setStatus(id, 'idea', it => `💡 „${it.title}“ liegt wieder in ${folderLabel(Data.origin(it))}`),
  discard: id => Act.setStatus(id, 'discarded', it => `🗑️ „${it.title}“ verworfen`),
  restore: id => Act.setStatus(id, 'idea', it => `💡 „${it.title}“ wiederhergestellt in ${folderLabel(Data.origin(it))}`),
  async purge(id) {
    const it = Store.raw('items', id);
    if (!it) return;
    const ok = await confirmDialog({
      title: 'Endgültig löschen?',
      text: `„${it.title}“ wird mit Notizen und Logbuch gelöscht. Das lässt sich nicht rückgängig machen.`,
      okLabel: 'Endgültig löschen', danger: true
    });
    if (!ok) return;
    Store.del('items', id);
    toast('Gelöscht');
  },
  setTitle(id, title) {
    Store.put('items', id, { title, updatedAt: Date.now() }, { silent: true });
  },
  setFolder(id, folderId) {
    Store.put('items', id, { folderId, updatedAt: Date.now() });
  },
  saveLog(id, entry) {
    const it = Store.raw('items', id);
    if (!it) return;
    const log = (it.log || []).filter(e => e.id !== entry.id);
    log.push(entry);
    Store.put('items', id, { log, updatedAt: Date.now() });
  },
  deleteLog(id, logId) {
    const it = Store.raw('items', id);
    if (!it) return;
    const prevLog = clone(it.log || []);
    Store.put('items', id, { log: prevLog.filter(e => e.id !== logId), updatedAt: Date.now() });
    undoToast('Logbuch-Eintrag gelöscht', () => Store.put('items', id, { log: prevLog }));
  },
  reorderActive(ids) {
    Store.batch(ids.map((id, i) => ({ type: 'put', coll: 'items', id, doc: { activeOrder: i + 1 } })));
  },
  createFolder({ name, emoji, color }) {
    const id = rid('f_');
    const order = Math.max(0, ...Store.all('folders').map(f => f.order || 0)) + 1;
    Store.put('folders', id, { name, emoji, color, order, createdAt: Date.now() });
    return id;
  },
  moveFolder(id, dir) {
    const list = Data.folders();
    const i = list.findIndex(f => f.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    Store.batch(list.map((f, k) => ({ type: 'put', coll: 'folders', id: f.id, doc: { order: k + 1 } })));
  },
  async deleteFolder(id) {
    const f = Store.raw('folders', id);
    if (!f) return;
    const n = Data.ideasIn(id).length;
    const ok = await confirmDialog({
      title: `Ordner „${f.name}“ löschen?`,
      text: n ? `${n} ${n === 1 ? 'Idee wandert' : 'Ideen wandern'} nach 📥 Unsortiert.` : 'Der Ordner ist leer.',
      okLabel: 'Ordner löschen', danger: true
    });
    if (!ok) return;
    // Alles, was sich diesen Ordner merkt, merkt sich ab jetzt Unsortiert
    const ops = Store.all('items').filter(i => i.folderId === id)
      .map(i => ({ type: 'put', coll: 'items', id: i.id, doc: { folderId: UNSORTED } }));
    ops.push({ type: 'del', coll: 'folders', id });
    if (App.openFolder === id) App.openFolder = null;
    Store.batch(ops);
    toast('Ordner gelöscht');
  }
};

/* Notizen speichern ca. 600 ms nach dem letzten Tippen (und beim Verlassen) */
const NotesSaver = (() => {
  const pending = new Map();
  function save(id) {
    const p = pending.get(id);
    if (!p) return;
    clearTimeout(p.timer);
    pending.delete(id);
    const it = Store.raw('items', id);
    if (it && it.notes !== p.value) Store.put('items', id, { notes: p.value, updatedAt: Date.now() }, { silent: true });
  }
  return {
    schedule(id, value) {
      const p = pending.get(id);
      if (p) clearTimeout(p.timer);
      pending.set(id, { value, timer: setTimeout(() => save(id), 600) });
    },
    flush: save,
    flushAll() { [...pending.keys()].forEach(save); }
  };
})();

  renderedTab: null
};
const TITLES = { start: 'Start', ordner: 'Ordner', mehr: 'Mehr' };

let renderQueued = false;
let renderPending = false;
/** Tippt der Nutzer gerade in einem Feld der Ansicht? Dann nicht neu zeichnen. */
function isTyping() {
  const a = document.activeElement;
  return !!(a && a.closest && a.closest('#view') && a.matches('textarea, input:not([type=search]):not([type=checkbox])'));
}
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  // setTimeout statt requestAnimationFrame: läuft auch, wenn der Tab im Hintergrund ist
  setTimeout(() => {
    renderQueued = false;
    if (isTyping()) { renderPending = true; return; }
    render();
  }, 0);
}
document.addEventListener('focusout', () => {
  if (!renderPending) return;
  // kurz warten, damit ein gerade angetippter Knopf seinen Klick noch bekommt
  setTimeout(() => { if (renderPending && !isTyping()) { renderPending = false; render(); } }, 260);
});

function render() {
  renderPending = false;
  const view = $('#view');
  if (App.renderedTab !== App.tab) {
    view.innerHTML = '';
    App.renderedTab = App.tab;
    window.scrollTo(0, 0);
  }
  $('#title').textContent = TITLES[App.tab];
  document.body.dataset.tab = App.tab; // Hintergrund je Tab (wie im Mockup)
  $$('.tab-btn').forEach(b => {
    const on = b.dataset.tab === App.tab;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#fab').hidden = App.tab === 'mehr';
  ({ start: viewStart, ordner: viewOrdner, mehr: viewMehr })[App.tab](view);
}

/* Glitzer-Partikel rund um den Spross (feste Zufallsverteilung) */
const SPECKS = (() => {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let s = '';
  for (let n = 0; n < 70; n++) {
    const lower = n >= 58;
    const x = lower ? -6 + rnd() * 110 : -8 + rnd() * 356;
    const y = lower ? 340 + rnd() * 80 : 36 + rnd() * 250;
    if (!lower && x > 74 && x < 262 && y > 96 && y < 250) continue; // nicht auf dem Spross
    const dot = rnd() < .35;
    const w = dot ? 2 + rnd() * 1.5 : 1.4 + rnd() * 1.6;
    const h = dot ? w : 3.5 + rnd() * 5;
    s += `<span class="speck" style="--x:${x.toFixed(1)}px;--y:${y.toFixed(1)}px;--w:${w.toFixed(1)}px;--h:${h.toFixed(1)}px;--r:${(-40 + rnd() * 80).toFixed(0)}deg;--o:${(.35 + rnd() * .6).toFixed(2)};--delay:-${(rnd() * 7).toFixed(1)}s"></span>`;
  }
  return s;
})();
function viewStart(view) {
  const act = Data.active();
  const pau = Data.paused();
  let h = '';
  document.body.classList.toggle('start-empty', !act.length);
  if (!act.length) {
    h += `<div class="empty-state"><div class="specks" aria-hidden="true">${SPECKS}</div>${ICON.sprout}<p>Du lernst gerade nichts.</p>
      <button class="btn primary" data-action="goto-ordner">${ICON.glassFolder}Schau in deine Ideen</button></div>`;
  } else {
    h += `<h2 class="sec-title">Gerade am Lernen</h2>
      <div class="list" data-list="active">${act.map(it => cardHTML(it, { handle: act.length > 1 })).join('')}</div>`;
  }
  if (pau.length) {
    h += `<button class="sec-toggle ${App.pausedOpen ? 'open' : ''}" data-action="toggle-paused" aria-expanded="${App.pausedOpen}">
      ⏸️ Pausiert (${pau.length})<span class="chev" aria-hidden="true">›</span></button>`;
    if (App.pausedOpen) h += `<div class="list">${pau.map(it => cardHTML(it)).join('')}</div>`;

  view.innerHTML = h;
}

function openCapture() {
  const onStart = App.tab === 'start';
  const pre = App.tab === 'ordner' && !App.query && App.openFolder && App.openFolder !== LEARNED && Data.folder(App.openFolder)
    ? App.openFolder : UNSORTED;
  const opts = [FIXED[UNSORTED], ...Data.folders()]
    .map(f => `<option value="${f.id}" ${f.id === pre ? 'selected' : ''}>${esc(folderLabel(f))}</option>`).join('');
  openSheet({
    title: 'Was willst du lernen?',
    body: `<input class="input big-input" id="cap-title" placeholder="z. B. Gitarre spielen" maxlength="120" enterkeyhint="done" autocomplete="off">
      <label class="field"><span>Ordner</span><select class="input" id="cap-folder">${opts}</select></label>

        <input type="checkbox" id="cap-active" ${onStart ? 'checked' : ''}><span class="switch"></span></label>

        <button class="btn" data-k="cancel">Abbrechen</button>
        <button class="btn primary" data-k="save">Speichern</button></div>`,
    onMount(sheet, close) {
      const title = $('#cap-title', sheet);
      title.focus();
      const save = () => {
        const t = title.value.trim();
        if (!t) { title.focus(); return; }
        const folderId = $('#cap-folder', sheet).value;
        const active = $('#cap-active', sheet).checked;
        Act.create({ title: t, folderId, active });
        close();
        const f = Data.folder(folderId);
        if (active) toast(`🔥 „${t}“ ist jetzt auf Start`);
        else {
          toast(`💡 Idee gespeichert in ${folderLabel(f)}`);
          if (App.tab === 'ordner' && !App.query) App.openFolder = folderId;
        }
        scheduleRender();
      };
      title.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
      $('[data-k=save]', sheet).addEventListener('click', save);
      $('[data-k=cancel]', sheet).addEventListener('click', close);
