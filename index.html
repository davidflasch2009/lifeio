<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a3760">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lifeio">
<meta name="description" content="Lifeio – Ideen sammeln und verwalten, was du in deiner Freizeit lernst.">
<title>Lifeio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  /* Design sofort setzen (kein Aufblitzen im falschen Modus) */
  try { const t = localStorage.getItem('lifeio-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ==========================================================================
   1. Design-Tokens – Frutiger Aero
      Dunkel = Ozean-Aurora (wie die Mockups), Hell = Himmel
   ========================================================================== */
:root {
  color-scheme: dark;
  --text: #ffffff;
  --text-dim: rgba(232, 248, 255, .8);
  --text-shadow: 0 1px 2px rgba(0, 20, 40, .55);
  --title: #ffffff;
  --title-shadow: 0 2px 6px rgba(0, 15, 35, .55);
  --link: #a8ecff;
  --tab-active: #cfe3f2;
  --tab-text: #ffffff;
  --tab-text-shadow: 0 1px 2px rgba(0, 25, 45, .6);
  --danger-text: #ffc2c8;

  --glass-tint: rgba(205, 230, 245, .13);
  --glass-hi: rgba(220, 240, 255, .30);
  --glass-border: rgba(225, 245, 255, .55);
  --glass-shadow: 0 8px 22px rgba(0, 10, 30, .4);
  --field-bg: rgba(255, 255, 255, .12);
  --field-border: rgba(255, 255, 255, .32);
  --field-text: #ffffff;
  --placeholder: rgba(240, 250, 255, .85);
  --inset-bg: rgba(0, 25, 45, .3);
  --inset-border: rgba(255, 255, 255, .16);
  --btn-text: #ffffff;
  --sheet-bg: linear-gradient(180deg, rgba(26, 92, 128, .94), rgba(6, 36, 64, .97));
  --toast-bg: rgba(6, 34, 58, .86);
  --aurora-opacity: 1;

  --page-bg: #0c3a3d;
  --sb-bg: rgba(3, 32, 64, .55);
  --cb-sec-bg: rgba(0, 25, 45, .2);
  --note-line: rgba(255, 255, 255, .09);
  --radius: 19px;
  --tabbar-h: 86px;
  --tabbar-bottom: 13px;
}
html[data-theme="light"] {
  color-scheme: light;
  --text: #0b3550;
  --text-dim: rgba(11, 53, 80, .74);
  --text-shadow: 0 1px 0 rgba(255, 255, 255, .55);
  --title: #ffffff;
  --title-shadow: 0 2px 10px rgba(0, 90, 160, .55), 0 1px 2px rgba(0, 70, 130, .6);
  --link: #0a6ed1;
  --tab-active: #0a6ed1;
  --tab-text: #0b3550;
  --tab-text-shadow: 0 1px 0 rgba(255, 255, 255, .6);
  --danger-text: #c0182b;
  --glass-tint: rgba(255, 255, 255, .42);
  --glass-hi: rgba(255, 255, 255, .78);
  --glass-border: rgba(255, 255, 255, .92);
  --glass-shadow: 0 10px 28px rgba(0, 80, 140, .22);
  --field-bg: rgba(255, 255, 255, .7);
  --field-border: rgba(0, 90, 140, .22);
  --field-text: #0b3550;
  --placeholder: rgba(11, 53, 80, .55);
  --inset-bg: rgba(255, 255, 255, .55);
  --inset-border: rgba(0, 90, 140, .14);
  --btn-text: #0b3550;
  --sheet-bg: linear-gradient(180deg, rgba(242, 252, 255, .95), rgba(212, 241, 255, .97));
  --toast-bg: rgba(8, 60, 95, .9);
  --aurora-opacity: .55;
  --page-bg: #bdeeb6;
  --sb-bg: rgba(40, 155, 225, .45);
  --cb-sec-bg: rgba(255, 255, 255, .32);
  --note-line: rgba(0, 90, 140, .1);
}
@media (prefers-color-scheme: light) {
  html:not([data-theme="dark"]) {
    color-scheme: light;
    --text: #0b3550;
    --text-dim: rgba(11, 53, 80, .74);
    --text-shadow: 0 1px 0 rgba(255, 255, 255, .55);
    --title: #ffffff;
    --title-shadow: 0 2px 10px rgba(0, 90, 160, .55), 0 1px 2px rgba(0, 70, 130, .6);
    --link: #0a6ed1;
    --tab-active: #0a6ed1;
  --tab-text: #0b3550;
  --tab-text-shadow: 0 1px 0 rgba(255, 255, 255, .6);
    --danger-text: #c0182b;
    --glass-tint: rgba(255, 255, 255, .42);
    --glass-hi: rgba(255, 255, 255, .78);
    --glass-border: rgba(255, 255, 255, .92);
    --glass-shadow: 0 10px 28px rgba(0, 80, 140, .22);
    --field-bg: rgba(255, 255, 255, .7);
    --field-border: rgba(0, 90, 140, .22);
    --field-text: #0b3550;
    --placeholder: rgba(11, 53, 80, .55);
    --inset-bg: rgba(255, 255, 255, .55);
    --inset-border: rgba(0, 90, 140, .14);
    --btn-text: #0b3550;
    --sheet-bg: linear-gradient(180deg, rgba(242, 252, 255, .95), rgba(212, 241, 255, .97));
    --toast-bg: rgba(8, 60, 95, .9);
    --aurora-opacity: .55;
    --page-bg: #bdeeb6;
  --sb-bg: rgba(40, 155, 225, .45);
    --cb-sec-bg: rgba(255, 255, 255, .32);
    --note-line: rgba(0, 90, 140, .1);
  }
}

/* ==========================================================================
   2. Grundlayout & Hintergrund (je Tab eigener Ozean-Verlauf wie im Mockup)
   ========================================================================== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--page-bg); scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
body {
  margin: 0;
  color: var(--text);
  text-shadow: var(--text-shadow);
  background: transparent;
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
a { color: var(--link); }
svg { display: block; }

.bg {
  position: fixed;
  inset: 0;
  bottom: calc(-1 * env(safe-area-inset-bottom, 0px) - 60px);
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  background: #021f3f;
}
/* Start: links Marine, Mitte Aurora, unten grün */
.bgl-start {
  background:
    radial-gradient(75% 26% at 42% 86%, rgba(10, 128, 96, .95), transparent 75%),
    radial-gradient(40% 26% at 0% 86%, rgba(13, 66, 62, .95), transparent 75%),
    radial-gradient(60% 35% at 100% 84%, rgba(3, 64, 96, .85), transparent 75%),
    radial-gradient(75% 42% at 62% 24%, rgba(22, 118, 150, .7), transparent 75%),
    radial-gradient(50% 30% at 0% 12%, rgba(12, 70, 100, .6), transparent 75%),
    linear-gradient(180deg, #03305a 0%, #01264a 38%, #04203f 55%, #0a1f38 66%, #0b2c3a 80%, #0c3d3e 100%);
}
.bgl-mehr {
  background:
    radial-gradient(42% 22% at 0% 90%, rgba(14, 72, 58, .95), transparent 75%),
    linear-gradient(162deg, transparent 38%, rgba(120, 205, 225, .13) 48%, transparent 58%),
    linear-gradient(180deg, transparent 55%, rgba(1, 18, 38, .35) 100%),
    linear-gradient(90deg, #00142c 0%, #001a36 20%, #012244 33%, #043a68 52%, #065483 68%, #08668a 84%, #0a6a87 100%);
}
.bgl-ordner {
  background:
    radial-gradient(55% 26% at 2% 84%, rgba(88, 165, 92, .95), transparent 75%),
    radial-gradient(36% 18% at 34% 90%, rgba(30, 140, 108, .8), transparent 75%),
    radial-gradient(62% 26% at 100% 0%, rgba(40, 150, 128, 1), rgba(30, 120, 115, .6) 45%, transparent 85%),
    radial-gradient(40% 22% at 60% 0%, rgba(20, 95, 110, .7), transparent 80%),
    radial-gradient(55% 30% at 100% 88%, rgba(3, 60, 93, .9), transparent 75%),
    linear-gradient(180deg, #00142f 0%, #021a3c 30%, #071b3a 55%, #0b1c34 70%, #0c2a36 100%);
}
html[data-theme="light"] .bgl { display: none; }
html[data-theme="light"] .bg,
html[data-theme="light"] body[data-tab] .bg {
  background:
    radial-gradient(120% 60% at 90% -5%, rgba(255, 255, 255, .8), transparent 60%),
    radial-gradient(130% 70% at 50% 115%, rgba(110, 220, 90, .55), transparent 60%),
    linear-gradient(165deg, #2aa7ee 0%, #79d1f7 38%, #c6f1fb 68%, #bff0b4 100%);
}
@media (prefers-color-scheme: light) {
  html:not([data-theme="dark"]) .bgl { display: none; }
  html:not([data-theme="dark"]) .bg,
  html:not([data-theme="dark"]) body[data-tab] .bg {
    background:
      radial-gradient(120% 60% at 90% -5%, rgba(255, 255, 255, .8), transparent 60%),
      radial-gradient(130% 70% at 50% 115%, rgba(110, 220, 90, .55), transparent 60%),
      linear-gradient(165deg, #2aa7ee 0%, #79d1f7 38%, #c6f1fb 68%, #bff0b4 100%);
  }
}

/* Aurora-Halo hinter dem Spross (Start) */
.halo {
  position: absolute;
  left: calc(50% - 351.5px);
  top: -14px;
  width: 600px; height: 600px;
  border-radius: 50%;
  opacity: 0;
  mix-blend-mode: screen;
  -webkit-mask: radial-gradient(75% 55% at 72% 18%, #000 35%, rgba(0, 0, 0, .5) 60%, transparent 85%);
  mask: radial-gradient(75% 55% at 72% 18%, #000 35%, rgba(0, 0, 0, .5) 60%, transparent 85%);
  background:
    radial-gradient(circle closest-side, transparent 52%, rgba(60, 200, 210, .14) 55%, rgba(150, 255, 230, .4) 57.5%, rgba(225, 255, 255, .6) 58.5%, rgba(110, 220, 255, .32) 60.5%, transparent 65%),
    radial-gradient(circle closest-side, transparent 72%, rgba(70, 210, 200, .22) 76%, rgba(160, 255, 225, .68) 80.5%, rgba(248, 255, 255, .98) 82.5%, rgba(120, 225, 255, .62) 85%, rgba(60, 170, 230, .32) 89%, rgba(160, 120, 255, .18) 93%, transparent 98%),
    radial-gradient(circle closest-side, transparent 55%, rgba(40, 180, 200, .26) 75%, transparent 92%);
  filter: blur(7px);
  transition: opacity .4s;
}
.halo::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle closest-side, transparent 45%, rgba(120, 230, 255, .22) 66%, transparent 82%);
  filter: blur(16px);
}
.flare {
  position: absolute;
  left: calc(50% - 30px);
  top: 0;
  width: 260px; height: 190px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(200, 255, 255, .5), rgba(110, 220, 240, .22) 45%, transparent 100%);
  mix-blend-mode: screen;
  opacity: 0;
  transition: opacity .4s;
}
body[data-tab="start"] .halo, body[data-tab="start"] .flare { opacity: var(--aurora-opacity); }
/* schwache Bögen im Ordner-Tab */
.arc {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
  mix-blend-mode: screen;
  transition: opacity .4s;
}
.arc.a1 {
  left: calc(50% + 40px); top: 380px;
  width: 700px; height: 700px;
  background: radial-gradient(circle closest-side, transparent 88%, rgba(110, 220, 255, .22) 92%, rgba(170, 255, 220, .3) 94%, transparent 98%);
}
.arc.a2 {
  left: calc(50% - 287.5px); top: 400px;
  width: 1000px; height: 1000px;
  filter: blur(5px);
  background: radial-gradient(circle closest-side, transparent 84%, rgba(120, 230, 140, .2) 87%, rgba(170, 255, 170, .45) 89%, rgba(120, 220, 200, .25) 91%, transparent 95%);
  -webkit-mask: linear-gradient(90deg, #000 20%, transparent 45%);
  mask: linear-gradient(90deg, #000 20%, transparent 45%);
}
body[data-tab="ordner"] .arc { opacity: var(--aurora-opacity); }

/* Funkeln (4-zackige Sterne) */
.spark {
  position: absolute;
  left: var(--x); top: var(--y);
  width: var(--s); height: var(--s);
  background:
    radial-gradient(circle, #fff 0 14%, transparent 15%),
    linear-gradient(90deg, transparent 45%, rgba(255, 255, 255, .95) 50%, transparent 55%),
    linear-gradient(0deg, transparent 45%, rgba(255, 255, 255, .95) 50%, transparent 55%);
  -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%);
  mask: radial-gradient(circle, #000 18%, transparent 68%);
  filter: drop-shadow(0 0 4px rgba(220, 255, 255, .9));
  opacity: .2;
  animation: twinkle var(--d) ease-in-out infinite;
  animation-delay: var(--delay);
}
@keyframes twinkle {
  0%, 100% { opacity: .15; transform: scale(.55) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.1) rotate(20deg); }
}
/* Glitzer-Partikel (kleine leuchtende Striche) */
.speck {
  position: absolute;
  left: var(--x); top: var(--y);
  width: var(--w); height: var(--h);
  border-radius: 2px;
  background: linear-gradient(180deg, rgba(220, 255, 255, .95), rgba(110, 220, 255, .35));
  box-shadow: 0 0 4px rgba(150, 240, 255, .8);
  transform: rotate(var(--r));
  opacity: var(--o);
  animation: drift 7s ease-in-out infinite alternate;
  animation-delay: var(--delay);
}
@keyframes drift { from { translate: 0 0; } to { translate: 3px 6px; } }
.dot {
  position: absolute;
  left: var(--x); top: var(--y);
  width: var(--s); height: var(--s);
  border-radius: 50%;
  background: rgba(150, 245, 255, .85);
  box-shadow: 0 0 5px rgba(120, 235, 255, .9);
  opacity: var(--o);
}
/* Wassertropfen (Glas mit Lichtbrechung) */
.drop {
  position: absolute;
  left: var(--x); bottom: var(--b);
  width: var(--s); height: calc(var(--s) * var(--k, 1));
  border-radius: 50%;
  background:
    radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .95) 0 10%, rgba(255, 255, 255, 0) 24%),
    radial-gradient(circle at 60% 70%, rgba(255, 255, 255, .35), rgba(255, 255, 255, 0) 40%),
    radial-gradient(circle, rgba(190, 240, 255, .12) 50%, rgba(0, 30, 50, .5) 78%, rgba(235, 252, 255, .9) 96%);
  box-shadow: 0 2px 5px rgba(0, 20, 40, .45), 0 0 0 .5px rgba(255, 255, 255, .5);
  transform: rotate(var(--r, 0deg));
  opacity: 0;
  transition: opacity .4s;
}
body[data-tab="start"].start-empty .drop.on-start,
body[data-tab="mehr"] .drop.on-mehr { opacity: .95; }
/* Inhalte laufen beim Scrollen nicht mehr ungeschützt unter Uhr und Akku durch */
.statusbar {
  position: fixed;
  left: 0; right: 0; top: 0;
  height: calc(env(safe-area-inset-top, 0px) * 1.3);
  z-index: 35;
  pointer-events: none;
  background: linear-gradient(180deg, var(--sb-bg) 0%, var(--sb-bg) 55%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  -webkit-mask: linear-gradient(180deg, #000 65%, transparent);
  mask: linear-gradient(180deg, #000 65%, transparent);
}
.ordner-dots { position: absolute; inset: 0; opacity: 0; transition: opacity .4s; }
body[data-tab="ordner"] .ordner-dots { opacity: 1; }
/* Tropfen liegen auf der Tab-Leiste – eigene Ebene darüber */
.drops { position: fixed; inset: 0; z-index: 31; pointer-events: none; }

.app {
  max-width: 680px;
  margin: 0 auto;
  min-height: calc(100dvh + 1px);
  padding-bottom: calc(var(--tabbar-h) + var(--tabbar-bottom) + 112px);
}
.topbar { padding: calc(max(env(safe-area-inset-top), 47px) + 4px) 19px 8px; }
.topbar h1 {
  margin: 0;
  font-size: 44px;
  line-height: 48px;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--title);
  text-shadow: var(--title-shadow);
}
#view { padding: 0 18px 16px; }

/* Schwebende Glas-Tab-Leiste */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: var(--tabbar-bottom);
  z-index: 30;
  display: flex;
  justify-content: center;
  padding: 0 10px;
  pointer-events: none;
}
.tabbar-inner {
  position: relative;
  pointer-events: auto;
  display: flex;
  width: 100%;
  max-width: 560px;
  height: var(--tabbar-h);
  border-radius: 34px;
  border: 1.5px solid rgba(220, 250, 255, .7);
  background:
    radial-gradient(45% 4px at 52% 0, rgba(255, 255, 255, 1), transparent),
    linear-gradient(180deg, rgba(205, 248, 252, .55) 0%, rgba(120, 210, 220, .4) 40%, rgba(80, 180, 195, .36) 60%, rgba(105, 205, 215, .46) 100%);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .55), inset 0 -3px 10px rgba(255, 255, 255, .18), inset 0 0 0 1px rgba(255, 255, 255, .12), 0 10px 26px rgba(0, 15, 35, .45);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
}
.tabbar-inner::before {
  /* Lichtreflex oben auf dem Glas */
  content: '';
  position: absolute;
  left: 8%; right: 8%; top: 3px;
  height: 38%;
  border-radius: 30px 30px 50% 50% / 30px 30px 14px 14px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .46), rgba(255, 255, 255, .04));
  pointer-events: none;
}
.tab-btn {
  position: relative;
  flex: 1;
  border: 0;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 14px;
  gap: 2px;
  font-size: 15px;
  font-weight: 700;
  color: var(--tab-text);
  text-shadow: var(--tab-text-shadow);
}
.tab-btn .ico { width: 50px; height: 50px; margin-top: -4px; filter: drop-shadow(0 2px 2px rgba(0, 25, 45, .35)); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.tab-btn .ico svg { width: 100%; height: 100%; }
.tab-btn.active { color: var(--tab-active); }
.tab-btn.active .ico { transform: scale(1.04); }

/* Glänzende „+“-Kugel */
.fab {
  position: fixed;
  right: max(15px, calc((100vw - 680px) / 2 + 15px));
  bottom: calc(var(--tabbar-bottom) + var(--tabbar-h) + 18px);
  z-index: 25;
  width: 72px; height: 72px;
  padding: 0;
  border-radius: 50%;
  border: 2px solid rgba(225, 235, 255, .85);
  background:
    radial-gradient(70% 45% at 50% 18%, rgba(255, 255, 255, .85) 0%, rgba(255, 255, 255, .25) 60%, rgba(255, 255, 255, 0) 100%),
    radial-gradient(circle at 50% 80%, #8fb2ff 0%, #5a6ef0 45%, #3b3fcf 80%, #2d2aa8 100%);
  box-shadow: 0 0 0 3px rgba(120, 150, 255, .25), 0 0 22px rgba(110, 140, 255, .55), 0 10px 22px rgba(10, 20, 90, .55), inset 0 -8px 14px rgba(20, 10, 120, .45), inset 0 2px 2px rgba(255, 255, 255, .6);
  transition: transform .15s;
}
.fab svg { width: 38px; height: 38px; margin: 0 auto; filter: drop-shadow(0 2px 2px rgba(20, 20, 110, .6)); }
.fab[hidden] { display: none; }
.fab:active { transform: scale(.92); }

/* ==========================================================================
   3. Glas, Knöpfe, Felder
   ========================================================================== */
.card, .panel, .search .input {
  background:
    radial-gradient(42% 3px at 50% 0, rgba(255, 255, 255, 1), transparent),
    radial-gradient(60% 40% at 50% 0, rgba(255, 255, 255, .14), transparent),
    linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .06) 40%, transparent 50%),
    linear-gradient(180deg, var(--glass-hi) 0%, var(--glass-tint) 45%, var(--glass-tint) 100%);
  border: 1.5px solid var(--glass-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 0 14px rgba(255, 255, 255, .08), var(--glass-shadow);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  backdrop-filter: blur(12px) saturate(140%);
}
.muted { color: var(--text-dim); }
.small { font-size: 13px; }
.grow { flex: 1; }
.sec-title {
  font-size: 13px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-dim);
  margin: 8px 4px 12px;
}
.sec-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin: 28px 0 12px;
  padding: 4px;
  border: 0;
  background: none;
  font-size: 13px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-dim);
  text-align: left;
}
.sec-toggle .chev { margin-left: auto; }
.sec-toggle.open .chev { transform: rotate(90deg); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1.5px solid var(--glass-border);
  color: var(--btn-text);
  text-shadow: var(--text-shadow);
  font-weight: 650;
  font-size: 15px;
  white-space: nowrap;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .42) 0%, rgba(255, 255, 255, .14) 48%, rgba(255, 255, 255, .03) 52%, rgba(255, 255, 255, .12) 100%),
    var(--field-bg);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 10px rgba(0, 30, 50, .18);
  transition: transform .12s, filter .12s;
}
.btn svg { width: 1.4em; height: 1.4em; flex: none; }
.btn.primary, .btn.blue, .btn.danger-fill {
  color: #fff;
  border-color: rgba(240, 225, 255, .75);
}
.btn.primary {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .72) 0%, rgba(255, 255, 255, .26) 44%, rgba(255, 255, 255, 0) 50%),
    linear-gradient(180deg, #dcb4ff 0%, #b072fb 46%, #8c45ef 70%, #a666f7 90%, #c89aff 100%);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, .95), inset 0 -4px 9px rgba(255, 220, 255, .35), 0 0 0 1px rgba(110, 50, 190, .4), 0 0 22px rgba(190, 120, 255, .6), 0 6px 14px rgba(40, 0, 90, .45);
  text-shadow: 0 1px 2px rgba(60, 0, 120, .65);
}
.btn.blue {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .6) 0%, rgba(255, 255, 255, .18) 46%, rgba(255, 255, 255, 0) 50%),
    linear-gradient(180deg, #6fc4ff 0%, #2d8df0 50%, #1767d0 80%, #2a80e6 100%);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, .9), inset 0 -5px 10px rgba(0, 40, 120, .3), 0 0 0 1px rgba(10, 70, 160, .35), 0 0 14px rgba(60, 150, 255, .45), 0 5px 12px rgba(0, 30, 80, .4);
  text-shadow: 0 1px 2px rgba(0, 50, 120, .6);
}
.btn.danger-fill {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, .14) 48%, rgba(255, 255, 255, 0) 52%),
    linear-gradient(180deg, #ff8591 0%, #e73b4d 52%, #c21d33 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), inset 0 -4px 10px rgba(120, 0, 20, .3), 0 6px 18px rgba(230, 50, 70, .45);
  text-shadow: 0 1px 1px rgba(110, 0, 20, .5);
}
.btn.danger { color: var(--danger-text); }
.btn.small { padding: 6px 13px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:active:not(:disabled) { transform: scale(.96); filter: brightness(1.1); }

.input {
  width: 100%;
  padding: 11px 13px;
  border-radius: 13px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  color: var(--field-text);
  box-shadow: inset 0 2px 5px rgba(0, 20, 40, .12);
  font: inherit;
  font-size: 16px; /* < 16px würde auf iOS hineinzoomen */
  text-shadow: none;
}
.input::placeholder { color: var(--placeholder); }
.input:focus { outline: none; border-color: rgba(140, 230, 255, .95); box-shadow: inset 0 2px 5px rgba(0, 20, 40, .12), 0 0 0 3px rgba(110, 215, 255, .35); }
select.input {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--field-text) 50%), linear-gradient(135deg, var(--field-text) 50%, transparent 50%);
  background-position: calc(100% - 19px) 52%, calc(100% - 14px) 52%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
select.input option { color: #0b2f45; background: #fff; }
textarea.input { resize: none; line-height: 1.45; }
input[type="date"].input { min-height: 46px; }
.field { display: block; margin-top: 13px; }
.field > span {
  display: block;
  font-size: 12px;
  font-weight: 750;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 6px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 23px;
  padding: 0 10px 0 7px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 650;
  color: var(--text);
  background: color-mix(in srgb, var(--c) 26%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25);
}
.chip .fm { display: inline-flex; align-items: center; font-size: 13px; line-height: 1; text-shadow: none; }
.chip .fm svg { width: 15px; height: 15px; }
.chip .dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .8), transparent 45%), var(--c);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .6), 0 0 6px var(--c);
  flex: none;
}

/* Leerer Start-Screen – Maße wie im Mockup */
.empty-state { position: relative; text-align: center; padding-top: 98px; }
.sprout-wrap { position: relative; width: 192px; height: 160px; margin: -5px auto 0; translate: 2px 0; transform-origin: 50% 98%; }
.sprout-img {
  position: relative;
  display: block;
  width: 100%; height: 100%;
  transform-origin: 52% 98%;
  filter: drop-shadow(0 0 16px rgba(150, 255, 170, .26));
  animation: sway 6.5s ease-in-out infinite;
}
.sprout-shadow {
  position: absolute;
  left: 50%; bottom: -5px;
  width: 92px; height: 15px;
  margin-left: -40px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(0, 15, 10, .62), rgba(0, 15, 10, 0));
}
.sprout-wrap > .spark { z-index: 1; }
.empty-state p { position: relative; margin: 20px 0 0; font-size: 23px; line-height: 26px; font-weight: 400; letter-spacing: -.01em; color: var(--text); }
.empty-state .btn { position: relative; margin-top: 26px; width: 291px; max-width: 100%; height: 61px; font-size: 21px; font-weight: 700; gap: 10px; }
.empty-state .btn svg { width: 34px; height: 34px; }
.empty-state .specks { position: absolute; inset: 0; pointer-events: none; }
.empty-small { color: var(--text-dim); text-align: center; padding: 20px 0; margin: 0; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* ==========================================================================
   4. Karten (überall gleich)
   ========================================================================== */
.list { display: flex; flex-direction: column; gap: 11px; }
.card {
  position: relative;
  color: var(--text);
  text-shadow: var(--text-shadow);
  border-radius: var(--radius);
  scroll-margin-top: 30px;
  scroll-margin-bottom: calc(var(--tabbar-h) + 120px);
}
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.card-main { flex: 1; min-width: 0; }
.card-title { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.card-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 3px; font-size: 13px; color: var(--text-dim); }
.chev { color: var(--text-dim); font-size: 24px; line-height: 1; transition: transform .2s; }
.card.open > .card-head .chev { transform: rotate(90deg); }
.handle {
  touch-action: none;
  cursor: grab;
  color: var(--text-dim);
  padding: 8px 6px;
  margin: -8px -2px -8px -6px;
  font-size: 18px;
  line-height: 1;
  letter-spacing: -3px;
}
.card.dragging { z-index: 5; cursor: grabbing; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 18px 40px rgba(0, 20, 40, .45); }
.list.drag-active .card:not(.dragging) { transition: transform .18s ease; }
.card-body { padding: 2px 16px 16px; border-top: 1px solid var(--inset-border); animation: bodyIn .24s ease; }
@keyframes bodyIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
/* Aufgeklappte Karte: Ordner-Pill, Aktions-Kacheln, Notizzettel, Logbuch-Zeitleiste */
.cb-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
.pill {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 13px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  color: var(--btn-text);
  text-shadow: var(--text-shadow);
  font-size: 14px;
  font-weight: 650;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .36) 0%, rgba(255, 255, 255, .1) 50%, rgba(255, 255, 255, .03) 52%, rgba(255, 255, 255, .1) 100%),
    var(--field-bg);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 2px 6px rgba(0, 25, 45, .15);
}
.pill svg { width: 20px; height: 20px; margin-left: -4px; }
.folder-pill {
  padding-right: 30px;
  cursor: pointer;
  border-color: color-mix(in srgb, var(--c) 60%, rgba(255, 255, 255, .6));
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .36) 0%, rgba(255, 255, 255, .1) 50%, rgba(255, 255, 255, .03) 52%, rgba(255, 255, 255, .1) 100%),
    color-mix(in srgb, var(--c) 28%, transparent);
}
.folder-pill .fm { display: inline-flex; align-items: center; font-size: 17px; line-height: 1; text-shadow: none; }
.folder-pill .fm svg { width: 20px; height: 20px; }
.folder-pill .dot {
  width: 11px; height: 11px;
  flex: none;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .85), transparent 45%), var(--c);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .6), 0 0 7px var(--c);
}
.folder-pill select {
  appearance: none;
  -webkit-appearance: none;
  max-width: 160px;
  border: 0;
  padding: 0;
  background: none;
  color: inherit;
  font: inherit;
  font-size: 16px;
  text-shadow: inherit;
  outline: none;
  cursor: pointer;
}
.folder-pill select option { color: #0b2f45; background: #fff; }
.folder-pill .caret {
  position: absolute;
  right: 13px; top: 50%;
  width: 7px; height: 7px;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: translateY(-70%) rotate(45deg);
  opacity: .75;
  pointer-events: none;
}
.since { margin-left: auto; font-size: 12.5px; color: var(--text-dim); white-space: nowrap; }
.cb-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.cb-actions.has-wide { grid-template-columns: 3fr 1fr; }
.tile {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 74px;
  padding: 10px 4px 9px;
  border-radius: 17px;
  border: 1px solid var(--glass-border);
  color: var(--btn-text);
  text-shadow: var(--text-shadow);
  font-size: 12.5px;
  font-weight: 700;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .34) 0%, rgba(255, 255, 255, .1) 48%, rgba(255, 255, 255, .03) 50%, rgba(255, 255, 255, .1) 100%),
    var(--field-bg);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .65), 0 3px 10px rgba(0, 25, 45, .16);
  transition: transform .15s, filter .15s;
}
.tile .ti { display: block; width: 32px; height: 32px; filter: drop-shadow(0 2px 3px rgba(0, 25, 45, .3)); }
.tile .ti svg { width: 100%; height: 100%; }
.tile .tl { line-height: 1.15; }
.tile:active { transform: scale(.95); filter: brightness(1.08); }
.tile.good {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .4) 0%, rgba(255, 255, 255, .12) 48%, rgba(255, 255, 255, .03) 50%, rgba(255, 255, 255, .1) 100%),
    linear-gradient(180deg, rgba(120, 220, 90, .3), rgba(60, 170, 60, .22));
  border-color: rgba(200, 255, 190, .65);
}
.tile.primary {
  color: #fff;
  text-shadow: 0 1px 2px rgba(60, 0, 120, .6);
  border-color: rgba(240, 225, 255, .75);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .6) 0%, rgba(255, 255, 255, .2) 46%, rgba(255, 255, 255, 0) 50%),
    linear-gradient(180deg, #d8acff 0%, #a964f9 48%, #8640ec 75%, #a466f6 100%);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, .9), inset 0 -4px 9px rgba(255, 220, 255, .3), 0 0 16px rgba(180, 110, 255, .45), 0 5px 12px rgba(40, 0, 90, .35);
}
.tile.primary .ti { filter: drop-shadow(0 2px 3px rgba(60, 0, 120, .45)); }
.tile.wide { flex-direction: row; gap: 10px; font-size: 17px; min-height: 64px; }
.tile.wide .ti { width: 34px; height: 34px; }
.cb-sec {
  margin-top: 14px;
  padding: 12px 12px 13px;
  border-radius: 17px;
  background: var(--cb-sec-bg);
  border: 1px solid var(--inset-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
}
.cb-sec h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 15.5px; font-weight: 750; }
.cb-sec h4 svg { width: 26px; height: 26px; flex: none; filter: drop-shadow(0 2px 2px rgba(0, 25, 45, .3)); }
.cb-sec h4 .btn { margin-left: auto; }
.cb-empty { margin: 0; font-size: 14px; color: var(--text-dim); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 20px; position: relative; display: flex; flex-direction: column; gap: 8px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 6px; top: 10px; bottom: 10px;
  width: 2px;
  border-radius: 2px;
  background: linear-gradient(180deg, rgba(127, 232, 255, .9), rgba(127, 232, 255, .15));
}
.timeline .log-entry { position: relative; }
.timeline .log-entry::before {
  content: '';
  position: absolute;
  left: -19px; top: 13px;
  width: 11px; height: 11px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0 20%, #8ff0ff 45%, #2a9fd6);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .5), 0 0 9px rgba(127, 232, 255, .85);
}
.sec { margin-top: 22px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 750; margin-bottom: 8px; }
.notes-view, .log-entry {
  background: var(--inset-bg);
  border: 1px solid var(--inset-border);
  box-shadow: inset 0 2px 6px rgba(0, 20, 40, .12);
  border-radius: 13px;
}
.notes-view {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding: 5px 13px 6px;
  min-height: 60px;
  line-height: 26px;
  cursor: text;
  background-image: repeating-linear-gradient(180deg, transparent 0 25px, var(--note-line) 25px 26px);
  background-position: 0 5px;
}
.notes-view.empty { color: var(--text-dim); }
textarea.notes-edit { min-height: 92px; display: block; line-height: 26px; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.log-entry { padding: 9px 13px; cursor: pointer; }
.log-date { font-size: 12px; font-weight: 750; color: var(--text-dim); }
.log-text { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Karten im Ordner: helles „Papier“ wie Blätter in einer Mappe */
.folder-inner .card {
  --text: #0b2f45;
  --text-dim: rgba(11, 47, 69, .66);
  --text-shadow: none;
  --link: #0a6ed1;
  --btn-text: #0b3550;
  --danger-text: #c0182b;
  --glass-border: rgba(0, 80, 120, .2);
  --field-bg: rgba(255, 255, 255, .78);
  --field-border: rgba(0, 80, 120, .2);
  --field-text: #0b2f45;
  --placeholder: rgba(11, 47, 69, .45);
  --inset-bg: rgba(0, 80, 120, .06);
  --inset-border: rgba(0, 80, 120, .11);
  --cb-sec-bg: rgba(0, 80, 120, .045);
  --note-line: rgba(0, 80, 120, .1);
  background:
    radial-gradient(50% 3px at 50% 0, #fff, transparent),
    linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .5) 40%, transparent 50%),
    linear-gradient(180deg, rgba(255, 255, 255, .97), rgba(230, 245, 252, .92));
  border: 1px solid rgba(255, 255, 255, .95);
  box-shadow: inset 0 -2px 6px rgba(0, 60, 100, .08), 0 3px 10px rgba(0, 30, 50, .22);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}

/* ==========================================================================
   5. Hängeregister (Ordner-Tab) – Maße wie im Mockup
   ========================================================================== */
.search { position: relative; margin: 23px 0 28px; }
.search .input {
  height: 47px;
  padding-left: 62px;
  background:
    radial-gradient(45% 3px at 40% 3px, rgba(255, 255, 255, .95), transparent),
    linear-gradient(180deg, rgba(255, 255, 255, .42) 0%, rgba(255, 255, 255, .17) 40%, rgba(255, 255, 255, .1) 62%, rgba(255, 255, 255, .2) 100%);
  border: 1.5px solid rgba(225, 248, 255, .72);
  box-shadow: inset 0 2px 1px rgba(255, 255, 255, .4), inset 0 -3px 7px rgba(0, 20, 40, .25), inset 0 0 14px rgba(255, 255, 255, .06), 0 4px 14px rgba(0, 15, 35, .35);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  padding-right: 42px;
  border-radius: 999px;
  font-size: 17px;
  color: var(--text);
  text-shadow: var(--text-shadow);
}
.search .input::placeholder { color: rgba(245, 252, 255, .95); text-shadow: var(--text-shadow); }
.search .input:focus { border-color: rgba(160, 235, 255, .95); }
.search .ico {
  position: absolute;
  z-index: 2; /* das Glasfeld bildet eine eigene Ebene – Lupe muss darüber liegen */
  left: -6px; top: -14px;
  width: 70px; height: 70px;
  filter: drop-shadow(0 3px 3px rgba(0, 20, 50, .5));
  pointer-events: none;
}
.search .ico svg { width: 100%; height: 100%; }
.search .clear {
  position: absolute;
  z-index: 2;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: none;
  color: var(--text-dim);
  font-size: 18px;
  padding: 6px 10px;
}
.search input::-webkit-search-cancel-button { display: none; }

.cabinet { padding: 0 0 8px; }
/* Ordner wie im Mockup: Rückwand mit Reiter (SVG, S-Kurven-Flanken) + glänzende Vorderklappe */
.folder {
  --fc: #7d9cb8;
  --fc-fg: #fff;
  --fc-ts: 0 1px 2px rgba(0, 0, 0, .45);
  position: relative;
  padding-top: 40px;
  scroll-margin-top: 20px;
}
.folder + .folder { margin-top: -55px; transition: margin-top .4s cubic-bezier(.2, .8, .2, 1); }
/* nach einem geöffneten Ordner nicht überlappen – sonst verdeckt der nächste Reiter die letzte Karte */
.folder.open + .folder { margin-top: -38px; }
/* unter der letzten Karte Platz lassen, den der nächste Reiter überlappt */
.folder.open:not(.last) .folder-inner { padding-bottom: 46px; }
.folder-art {
  position: absolute;
  left: 0; top: 0;
  width: 100%; height: 72px;
  overflow: visible;
  pointer-events: none;
  filter: drop-shadow(0 -2px 5px rgba(0, 15, 35, .3));
  transition: filter .3s;
}
.folder.open .folder-art { filter: drop-shadow(0 -3px 8px rgba(160, 230, 255, .28)) brightness(1.05); }
@media (hover: hover) { .folder:not(.open):hover .folder-art { filter: drop-shadow(0 -3px 7px rgba(0, 15, 35, .3)) brightness(1.06); } }
.folder-tab {
  position: absolute;
  z-index: 1;
  top: 0;
  left: calc(var(--tab-frac, 0) * 100% + 30px);
  height: 30px;
  display: flex;
  align-items: center;
  white-space: nowrap;
  color: var(--fc-fg);
  text-shadow: var(--fc-ts);
}
.folder.off0 .folder-tab { left: 14px; }
.folder-tab-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 30px;
  min-width: 0;
  padding: 0 2px;
  border: 0;
  border-radius: 10px;
  background: none;
  color: inherit;
  font-weight: 700;
  font-size: 21px;
  letter-spacing: -.015em;
}
.folder-tab-btn .emo { font-size: 20px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .3)); text-shadow: none; }
.folder-tab-btn .emo svg { width: 27px; height: 27px; }
.folder-tab-btn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
.folder-tab .count {
  min-width: 27px;
  height: 21px;
  line-height: 21px;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  color: #fff;
  text-shadow: 0 1px 1px rgba(0, 0, 0, .3);
  background: rgba(0, 20, 30, .3);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .4), 0 1px 0 rgba(255, 255, 255, .3);
}
.folder-more { border: 0; background: none; color: inherit; font-weight: 800; font-size: 20px; padding: 0 2px 0 6px; height: 30px; }
.folder:not(.open) .folder-more { display: none; }
.folder-front {
  position: relative;
  min-height: 76px;
  padding: 0 8px;
  border-radius: 13px;
  border: 1px solid rgba(255, 255, 255, .26);
  background:
    radial-gradient(155% 108% at 0% 0%, rgba(255, 255, 255, .34) 0%, rgba(255, 255, 255, .24) 54%, rgba(255, 255, 255, .07) 55.5%, rgba(255, 255, 255, 0) 60%),
    linear-gradient(180deg, rgba(255, 255, 255, .5) 0, rgba(255, 255, 255, .12) 2px, rgba(255, 255, 255, 0) 16px),
    linear-gradient(180deg, var(--f-front1) 0%, var(--f-front2) 48%, var(--f-front3) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), inset 0 -2px 0 rgba(255, 255, 255, .14), inset 0 -12px 16px rgba(0, 25, 45, .22), 0 -3px 8px rgba(0, 20, 40, .2), 0 10px 22px rgba(0, 15, 35, .35);
  transition: min-height .4s cubic-bezier(.2, .8, .2, 1);
}
/* Der vorderste Ordner zeigt seine ganze Vorderseite – wie im Mockup */
.folder.last:not(.open) .folder-front { min-height: 82px; }
/* Funkeln an den Ecken */
.folder > .spark { --s: 18px; left: auto; right: -7px; top: 22px; animation-duration: 3.8s; }
.folder-front > .spark { --s: 20px; left: auto; right: -8px; top: -10px; animation-duration: 3.4s; }
.folder-front > .spark.sp-left { left: -8px; right: auto; --s: 14px; animation-duration: 4.4s; }
.folder-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.2, .8, .2, 1); }
.folder.open .folder-wrap { grid-template-rows: 1fr; }
.folder.open .folder-front { min-height: 0; }
.folder-content { overflow: hidden; min-height: 0; }
.folder-inner { display: flex; flex-direction: column; gap: 9px; padding: 10px 0 10px; }
.folder:not(.open) .folder-inner { visibility: hidden; transition: visibility 0s .4s; }
.folder-new {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 177px;
  height: 48px;
  margin: 15px 0 0 1px;
  padding: 0;
  border: 2px dashed rgba(200, 225, 240, .55);
  border-radius: 12px;
  background: rgba(255, 255, 255, .04);
  color: rgba(230, 245, 255, .9);
  text-shadow: var(--text-shadow);
  font-weight: 600;
  font-size: 17px;
}

/* ==========================================================================
   6. Mehr-Tab – Maße wie im Mockup
   ========================================================================== */
.panel {
  position: relative;
  border-radius: var(--radius);
  padding: 14px 15px 15px;
  margin-bottom: 11px;
}
.panel:first-child { margin-top: 7px; }
.panel h2 { font-size: 19px; line-height: 24px; font-weight: 700; margin: 0 0 6px; }
.panel p { margin: 0 0 12px; }
.panel .desc { font-size: 15px; line-height: 21px; margin: 0 0 9px; }
.panel-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  border: 0;
  background: none;
  padding: 0;
  font-weight: 700;
  font-size: 19px;
  text-align: left;
}
.panel-toggle svg { width: 54px; height: 54px; flex: none; margin: -14px -6px -12px -9px; filter: drop-shadow(0 2px 2px rgba(0, 20, 40, .4)); }
.panel-toggle .chev { margin-left: auto; color: #fff; font-size: 26px; }
.panel-toggle.open .chev { transform: rotate(90deg); }
.panel.p-verw { padding: 9px 15px; min-height: 59px; display: flex; flex-direction: column; justify-content: center; }
.acct { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.acct img { width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .8); box-shadow: 0 3px 8px rgba(0, 0, 0, .25); }
.acct-local { margin: 0 0 12px; font-size: 15px; line-height: 20.5px; }
.acct-local::after { content: ''; display: table; clear: both; }
.acct-local .phone-ic { float: left; width: 25px; height: 39px; margin: 1px 9px 0 2px; filter: drop-shadow(0 2px 2px rgba(0, 20, 40, .45)); }
.acct-local .phone-ic svg { width: 100%; height: 100%; }
.acct-local p { margin: 0; }
.panel .btn.primary.google { height: 50px; padding: 0 27px; font-size: 19px; font-weight: 700; }
.panel .btn.blue { height: 42px; width: calc(50% - 6px); padding: 0 8px; font-size: 16px; font-weight: 700; }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 11px 0; border-top: 1px solid var(--inset-border); }
.row:first-child { border-top: 0; }
.row-main { flex: 1 1 180px; min-width: 0; }
.row-title { font-weight: 650; overflow-wrap: anywhere; }
.btn-row { display: flex; flex-wrap: wrap; gap: 11px; }
.seg {
  display: flex;
  height: 47px;
  padding: 4px;
  margin: 9px 3px -3px 0;
  border-radius: 25px;
  background: rgba(150, 190, 205, .18);
  border: 1px solid rgba(255, 255, 255, .22);
  box-shadow: inset 0 2px 6px rgba(0, 20, 40, .25);
}
.seg button {
  flex: 1;
  border: 1px solid transparent;
  background: none;
  padding: 0 2px;
  border-radius: 21px;
  font-weight: 500;
  font-size: 15.5px;
  white-space: nowrap;
  color: rgba(240, 250, 255, .9);
}
.seg button.on {
  color: #fff;
  font-weight: 600;
  border-color: rgba(255, 255, 255, .7);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, .2) 50%, rgba(255, 255, 255, .1) 52%, rgba(255, 255, 255, .25) 100%),
    rgba(170, 210, 225, .35);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), 0 2px 8px rgba(0, 30, 60, .3);
}
.about { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 0; color: var(--text-dim); font-size: 13px; }
.about img { width: 34px; height: 34px; filter: drop-shadow(0 3px 6px rgba(0, 30, 60, .35)); }

/* ==========================================================================
   7. Sheets, Dialoge, Hinweise
   ========================================================================== */
.sheet-backdrop {
  position: fixed;
  left: 0; right: 0;
  top: var(--vv-top, 0px);
  height: var(--vv-h, 100%);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 15, 30, 0);
  transition: background .2s;
}
.sheet-backdrop.show { background: rgba(0, 15, 30, .45); }
.sheet {
  width: 100%;
  max-width: 440px;
  max-height: 100%;
  overflow: auto;
  color: var(--text);
  text-shadow: var(--text-shadow);
  background: var(--sheet-bg);
  border: 1px solid rgba(255, 255, 255, .45);
  border-radius: 26px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 20px 50px rgba(0, 15, 35, .5);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  backdrop-filter: blur(24px) saturate(160%);
  padding: 18px 18px 20px;
  opacity: 0;
  transform: translateY(12px) scale(.95);
  transition: transform .26s cubic-bezier(.2, .8, .2, 1), opacity .22s ease;
}
.sheet-backdrop.show .sheet { transform: none; opacity: 1; }
.sheet-grab { display: none; }
.sheet-title { margin: 4px 0 6px; font-size: 21px; font-weight: 750; }
.sheet-text { margin: 6px 0 4px; color: var(--text-dim); }
.sheet-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
.sheet-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.sheet-list .btn { justify-content: flex-start; border-radius: 16px; padding: 14px 18px; font-size: 16px; }
.big-input { font-size: 18px; padding: 14px 15px; }
.swatches { display: flex; flex-wrap: wrap; gap: 11px; }
.swatch {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .75);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .6), rgba(255, 255, 255, .12) 48%, rgba(255, 255, 255, 0) 52%),
    var(--c);
  box-shadow: inset 0 -3px 6px rgba(0, 0, 0, .18), 0 2px 6px rgba(0, 0, 0, .25);
}
.swatch.on { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 14px var(--c), 0 2px 6px rgba(0, 0, 0, .25); }
.emoji-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.emoji-row button {
  width: 40px; height: 40px;
  padding: 0;
  border-radius: 12px;
  border: 1px solid var(--field-border);
  background: linear-gradient(180deg, rgba(255, 255, 255, .3), rgba(255, 255, 255, .06) 52%), var(--field-bg);
  font-size: 20px;
}
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; font-weight: 650; cursor: pointer; }
.switch-row input { position: absolute; opacity: 0; pointer-events: none; }
.switch {
  position: relative;
  flex: none;
  width: 54px; height: 32px;
  border-radius: 999px;
  background: var(--inset-bg);
  border: 1px solid var(--field-border);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, .25);
  transition: background .2s;
}
.switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 25%, #fff 0 35%, #dfe9f0 100%);
  box-shadow: 0 2px 5px rgba(0, 0, 0, .35), inset 0 -2px 3px rgba(0, 0, 0, .08);
  transition: transform .22s cubic-bezier(.3, 1.4, .5, 1);
}
.switch-row input:checked + .switch {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, .1) 50%, rgba(255, 255, 255, 0) 54%),
    linear-gradient(180deg, #c487ff, #7c35e8);
  border-color: rgba(255, 255, 255, .6);
}
.switch-row input:checked + .switch::after { transform: translateX(22px); }
.switch-row input:focus-visible + .switch { outline: 2px solid #a8ecff; outline-offset: 2px; }

#toasts {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--tabbar-bottom) + var(--tabbar-h) + 102px); /* über dem „+“-Knopf */
  z-index: 60;
  display: flex;
  justify-content: center;
  padding: 0 14px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 560px;
  width: max-content;
  padding: 12px 10px 12px 18px;
  border-radius: 18px;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  background: radial-gradient(50% 3px at 50% 0, rgba(255, 255, 255, .8), transparent), var(--toast-bg);
  border: 1px solid rgba(255, 255, 255, .35);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 10px 28px rgba(0, 20, 40, .4);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  animation: toastIn .24s ease;
}
.toast.error { background: linear-gradient(180deg, #e2475a, #a8192f); }
.toast.warn { background: linear-gradient(180deg, #e9a21a, #a86a00); }
.toast span { flex: 1; }
.toast button { border: 0; background: none; color: #9ff0ff; font-weight: 750; padding: 4px 8px; white-space: nowrap; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }


/* ==========================================================================
   8. Animationen – alles soll leben
   ========================================================================== */
#fx { position: fixed; inset: 0; z-index: 45; pointer-events: none; overflow: hidden; }
.ghost { position: fixed; z-index: 45; pointer-events: none; will-change: transform, opacity; }
.ghost.folder-inner { padding: 0; display: block; }
.ghost > .card { margin: 0; height: 100%; }

/* Partikel (Konfetti, Sterne, Blasen) */
.pt { position: fixed; pointer-events: none; will-change: transform, opacity; }
.pt.dot { border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.pt.bub {
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #fff 0 18%, rgba(255, 255, 255, .15) 40%, rgba(255, 255, 255, .05) 60%, var(--c) 100%);
  box-shadow: 0 0 6px var(--c);
}
.pt.star {
  background:
    radial-gradient(circle, #fff 0 14%, transparent 15%),
    linear-gradient(90deg, transparent 42%, var(--c) 50%, transparent 58%),
    linear-gradient(0deg, transparent 42%, var(--c) 50%, transparent 58%);
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%);
  mask: radial-gradient(circle, #000 20%, transparent 70%);
  filter: drop-shadow(0 0 4px var(--c));
}
.pt-ring {
  position: fixed;
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 3px solid rgba(190, 255, 220, .85);
  box-shadow: 0 0 22px rgba(150, 255, 200, .7), inset 0 0 14px rgba(150, 255, 200, .5);
  pointer-events: none;
}
.orb {
  position: fixed;
  width: 24px; height: 24px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle at 32% 28%, #fff 0 16%, rgba(190, 240, 255, .55) 38%, rgba(110, 170, 255, .45) 70%, rgba(170, 130, 255, .7) 100%);
  box-shadow: 0 0 18px rgba(140, 200, 255, .9), 0 0 40px rgba(160, 120, 255, .5);
}

/* Lichtwelle beim Antippen */
.btn, .tab-btn, .folder-tab-btn, .panel-toggle, .seg button, .folder-new { position: relative; overflow: hidden; }
.tab-btn { border-radius: 28px; }
.ripple {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255, 255, 255, .6), rgba(255, 255, 255, .15) 45%, rgba(255, 255, 255, 0) 70%);
  transform: scale(0);
}

/* Glanz-Schimmer über die lila Knöpfe */
.btn.primary::after {
  content: '';
  position: absolute;
  top: -30%; bottom: -30%;
  left: 0;
  width: 38%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .36), transparent);
  transform: translateX(-160%) skewX(-22deg);
  animation: shine 8s ease-in-out infinite;
  pointer-events: none;
}
.empty-state .btn.primary::after { animation-delay: 1.6s; }
@keyframes shine { 0%, 76% { transform: translateX(-160%) skewX(-22deg); } 100% { transform: translateX(360%) skewX(-22deg); } }

/* Panels: Lichtstreif beim Erscheinen */
.panel { overflow: hidden; }
.panel::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: 0;
  width: 45%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .09), transparent);
  transform: translateX(-130%) skewX(-18deg);
  animation: panelSweep 1.4s .35s cubic-bezier(.4, 0, .2, 1) both;
  pointer-events: none;
}
@keyframes panelSweep { to { transform: translateX(330%) skewX(-18deg); } }

/* „+“-Kugel: schwebt, pulsiert, dreht beim Antippen */
.fab { animation: fabFloat 4.2s ease-in-out infinite; }
.fab::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  border: 2px solid rgba(150, 175, 255, .55);
  animation: ringPulse 2.8s ease-out infinite;
  pointer-events: none;
}
.fab.spin svg { animation: fabSpin .45s cubic-bezier(.2, .9, .3, 1); }
@keyframes fabFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -2px; } }
@keyframes ringPulse { 0% { transform: scale(.95); opacity: .42; } 100% { transform: scale(1.28); opacity: 0; } }
@keyframes fabSpin { from { transform: rotate(0) scale(.85); } to { transform: rotate(90deg) scale(1); } }

/* Tab-Leiste: gleitendes Glas-Leuchten unter dem aktiven Tab */
.tab-glow {
  position: absolute;
  top: 6px; bottom: 6px;
  left: 6px;
  width: calc((100% - 12px) / 3);
  border-radius: 28px;
  background: radial-gradient(55% 50% at 50% 40%, rgba(255, 255, 255, .2), rgba(255, 255, 255, .05) 65%, transparent 80%);
  transform: translateX(calc(var(--tab-i, 0) * 100%));
  transition: transform .5s cubic-bezier(.3, 1.15, .5, 1);
  pointer-events: none;
}

/* Spross: wächst und wiegt sich */
.grow .sprout-wrap { animation: sproutGrow .9s .1s cubic-bezier(.25, 1.1, .45, 1) both; }
.grow .sprout-shadow { animation: shadowIn .8s .1s ease-out both; }
@keyframes sproutGrow { from { opacity: 0; transform: translateY(10px) scale(.6); } 55% { opacity: 1; } to { opacity: 1; transform: none; } }
.grow p { animation: riseIn .6s 1s cubic-bezier(.2, .9, .25, 1.1) both; }
.grow .btn { animation: riseIn .6s 1.15s cubic-bezier(.2, .9, .25, 1.1) both; }
.grow .specks { animation: fadeIn 1s .9s ease-out both; }
@keyframes sway { 0%, 100% { transform: rotate(-1.3deg); } 50% { transform: rotate(1.3deg); } }
@keyframes flutterL { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-4deg); } }
@keyframes flutterR { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(5deg); } }
@keyframes drawStem { to { stroke-dashoffset: 0; } }
@keyframes leafPop { from { transform: scale(0) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shadowIn { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes starPop { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes starTwinkle { 0%, 100% { transform: scale(.75) rotate(0); opacity: .75; } 50% { transform: scale(1.2) rotate(45deg); opacity: 1; } }
@keyframes riseIn { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.speck { animation: drift 7s ease-in-out infinite alternate, speckTwinkle 3.4s ease-in-out infinite; }
@keyframes speckTwinkle { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }

/* Hintergrund: weicher Wechsel zwischen den Tabs, atmende Aurora, aufsteigende Blasen */
.bgl { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; }
body[data-tab="start"] .bgl-start, body[data-tab="mehr"] .bgl-mehr, body[data-tab="ordner"] .bgl-ordner { opacity: 1; }
.halo { animation: haloBreath 13s ease-in-out infinite alternate; }
.flare { animation: flarePulse 6s ease-in-out infinite; }
.arc.a1 { animation: arcTurn 30s ease-in-out infinite alternate; }
.arc.a2 { animation: arcTurn 38s ease-in-out infinite alternate-reverse; }
@keyframes haloBreath { from { transform: rotate(-1.5deg) scale(.995); } to { transform: rotate(2deg) scale(1.025); } }
@keyframes flarePulse { 0%, 100% { scale: 1; } 50% { scale: 1.08; } }
@keyframes arcTurn { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
.rise {
  position: absolute;
  left: var(--x);
  bottom: -40px;
  width: var(--s); height: var(--s);
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .9) 0 10%, rgba(255, 255, 255, .25) 18%, rgba(255, 255, 255, .04) 48%, rgba(255, 255, 255, .14) 74%, rgba(255, 255, 255, .5) 100%);
  opacity: 0;
  animation: rise var(--d) linear infinite;
  animation-delay: var(--delay);
}
@keyframes rise {
  0% { transform: translate3d(0, 0, 0); opacity: 0; }
  10% { opacity: .7; }
  50% { transform: translate3d(14px, -55vh, 0); }
  88% { opacity: .55; }
  100% { transform: translate3d(-10px, -112vh, 0); opacity: 0; }
}
.drop { animation: wobble var(--w, 5s) ease-in-out infinite; }
@keyframes wobble {
  0%, 100% { transform: rotate(var(--r, 0deg)) scale(1, 1); }
  35% { transform: rotate(var(--r, 0deg)) scale(1.03, .97); }
  70% { transform: rotate(var(--r, 0deg)) scale(.98, 1.025); }
}

/* Ordner: Blätter fächern beim Öffnen nacheinander auf, Reiter heben sich */
.folder.just-opened .folder-inner > .card { animation: paperIn .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 45ms + 100ms); }
@keyframes paperIn { from { opacity: 0; transform: translateY(-8px) scale(.985); } to { opacity: 1; transform: none; } }
.count.bump { animation: bump .6s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.22); background: rgba(255, 255, 255, .4); } 100% { transform: scale(1); } }

/* Karten: sanftes Anheben, aufklappen mit Schwung */
@media (hover: hover) { .card:not(.open):not(.dragging):hover { transform: translateY(-1px); } }
.card { transition: transform .25s ease, box-shadow .25s ease; }
.card-head:active .card-main { transform: scale(.985); }
.card-main { transition: transform .15s; }
.card-body { animation: bodyIn .38s cubic-bezier(.2, .9, .25, 1.1); }
.card-body > * { animation: riseIn .4s both; }
.card-body > :nth-child(2) { animation-delay: .04s; }
.card-body > :nth-child(3) { animation-delay: .08s; }
.card-body > :nth-child(4) { animation-delay: .12s; }
.card-body > :nth-child(5) { animation-delay: .16s; }

/* Sheets federn herein, Inhalte nacheinander */
.sheet { transition: transform .4s cubic-bezier(.25, 1.08, .4, 1), opacity .22s ease; }
.sheet-backdrop.show .sheet > * { animation: riseIn .45s both; animation-delay: calc(var(--i, 0) * 40ms + 90ms); }

/* Hinweise: federn hoch, Rückgängig-Zeitbalken */
.toast { position: relative; overflow: hidden; animation: toastIn .4s cubic-bezier(.2, .9, .3, 1); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.toast-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: linear-gradient(90deg, #8ff2ff, #c9a0ff); transform-origin: left; animation: toastBar linear forwards; }
@keyframes toastBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* Darstellung: gleitende Glas-Pille */
.seg { position: relative; }
.seg-pill {
  position: absolute;
  top: 4px; bottom: 4px; left: 4px;
  width: calc((100% - 8px) / 3);
  border-radius: 21px;
  border: 1px solid rgba(255, 255, 255, .7);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, .2) 50%, rgba(255, 255, 255, .1) 52%, rgba(255, 255, 255, .25) 100%),
    rgba(170, 210, 225, .35);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), 0 2px 8px rgba(0, 30, 60, .3);
  transform: translateX(calc(var(--seg-i, 0) * 100%));
  transition: transform .45s cubic-bezier(.3, 1.12, .5, 1);
  pointer-events: none;
}
.seg button { z-index: 1; transition: color .3s; }
.seg button.on { background: none; border-color: transparent; box-shadow: none; }

/* Intro: Logo glänzt auf */
#splash {
  position: fixed;
  left: 0; right: 0; top: 0;
  /* über den Home-Leisten-Bereich hinaus – iOS rechnet ihn beim ersten Laden nicht mit (sonst Streifen unten) */
  bottom: calc(-1 * env(safe-area-inset-bottom, 0px) - 60px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 60px);
  z-index: 200;
  display: grid;
  place-items: center;
  background: radial-gradient(60% 40% at 50% 45%, #0b5a78, #031d3c 70%);
  transition: opacity .5s ease;
}
#splash img {
  width: 132px; height: 132px;
  filter: drop-shadow(0 0 30px rgba(120, 230, 255, .65)) drop-shadow(0 10px 20px rgba(0, 10, 30, .5));
  animation: splashPop .5s cubic-bezier(.2, .9, .3, 1) both;
}
#splash.out { opacity: 0; pointer-events: none; }
